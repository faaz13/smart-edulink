<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --secondary: #0ea5e9;
      --bg-dark: #020617;
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-dim: #94a3b8;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top right, #1e1b4b, #0f172a, #020617);
      background-size: cover;
      display: flex;
      justify-content: center;
      padding: 4rem 2rem;
      color: var(--text-main);
      overflow-x: hidden;
      position: relative;
    }

    .blob {
      position: absolute;
      filter: blur(100px);
      z-index: 0;
      opacity: 0.15;
      border-radius: 50%;
      pointer-events: none;
    }

    .blob-1 { top: -10%; left: -5%; width: 500px; height: 500px; background: #4f46e5; }
    .blob-2 { bottom: -10%; right: -5%; width: 600px; height: 600px; background: #0ea5e9; }

    .outer {
      width: 100%;
      max-width: 700px;
      background: var(--glass-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border);
      padding: 4rem;
      border-radius: 32px;
      box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.6);
      position: relative;
      z-index: 1;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -1.5px;
      margin-bottom: 3rem;
      background: linear-gradient(to right, #fff, var(--text-dim));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .add {
      display: flex;
      gap: 1rem;
      margin-bottom: 3.5rem;
      background: rgba(255, 255, 255, 0.03);
      padding: 10px;
      border-radius: 20px;
      border: 1px solid var(--glass-border);
      transition: var(--transition);
    }

    .add:focus-within {
      border-color: var(--primary);
      background: rgba(255, 255, 255, 0.06);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
    }

    input {
      flex: 1;
      padding: 0.75rem 1.25rem;
      border: none;
      background: transparent;
      font-size: 1.1rem;
      outline: none;
      color: #fff;
      font-weight: 500;
    }

    input::placeholder {
      color: #4b5563;
    }

    #bt1 {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      border: none;
      padding: 0 2.5rem;
      border-radius: 14px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
    }

    #bt1:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px -5px rgba(99, 102, 241, 0.5);
    }

    ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 2rem;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      transition: var(--transition);
      cursor: pointer;
    }

    li:hover {
      transform: translateX(8px);
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(99, 102, 241, 0.2);
    }

    li span {
      flex: 1;
      font-weight: 600;
      color: #fff;
      font-size: 1.1rem;
    }

    li.completed {
      opacity: 0.4;
      background: rgba(255, 255, 255, 0.01);
    }

    li.completed span {
      text-decoration: line-through;
      color: var(--text-dim);
    }

    .del {
      background: rgba(239, 68, 68, 0.1);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.2);
      padding: 0.6rem 1.2rem;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.85rem;
      transition: var(--transition);
    }

    .del:hover {
      background: #ef4444;
      color: #fff;
      transform: scale(1.05);
    }
    </style>
</head>

<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
    <div class="outer">
        <h1 class="heading">To Do List</h1>
        <div class="add">
            <input type="text" id="addtask" placeholder="Write a new task...">
            <button id="bt1">Add Task</button>
        </div>
        <ul class="list"></ul>
    </div>
</body>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        let ul = document.querySelector('ul');
        let btn = document.querySelector('button');
        let input = document.querySelector('input');

        let tasks = [];
        let storageKey = 'tasks';
        const API_BASE = "https://edulink-backend-o3hw.onrender.com/api/v1";

        async function init() {
            try {
                const res = await fetch(`${API_BASE}/currentUser`, {
                    method: "POST",
                    credentials: "include",
                });
                if (res.ok) {
                    const data = await res.json();
                    if (data.success && data.user && data.user.username) {
                        storageKey = `tasks_${data.user.username}`;
                    }
                }
            } catch (error) {
                console.error("Auth check failed:", error);
            }
            retriveTasks();
        }

        function retriveTasks() {
            tasks = JSON.parse(localStorage.getItem(storageKey)) || [];
            tasks.forEach(task => renderTask(task));
        }

        function renderTask(task) {
            createTask(task);
            console.log(task);
        }

        init();

        function clearInput() {
            input.value = "";
        }

        function getValue() {
            return input.value;
        }

        function validateInput() {
            let task = getValue();
            if (task.trim() == '') {
                return false;
            }
            return true;
        }

        function createTask(obj) {
            let inner = document.createElement('span');
            let li = document.createElement('li');
            inner.innerText = `${obj.text}`;

            let delBtn = document.createElement('button');
            delBtn.setAttribute('class', 'del');
            delBtn.innerText = 'Delete';

            li.setAttribute('id', String(obj.id));

            if (obj.completed) {
                li.setAttribute("class", "completed");
            }

            li.appendChild(inner);
            li.appendChild(delBtn);
            ul.appendChild(li);
        }

        function saveTask(arr) {
            localStorage.setItem(storageKey, JSON.stringify(arr))
        }

        btn.addEventListener('click', function (event) {
            if (!validateInput()) {
                return;
            }

            let obj = {
                id: Date.now(),
                text: getValue(),
                completed: false,
            }

            createTask(obj);

            tasks.push(obj);
            saveTask(tasks);
            clearInput();
        })

        ul.addEventListener('click', function (event) {
            let target = event.target;

            if (target.tagName == "LI") {
                target.classList.toggle("completed");

                let task = tasks.find(t => (t.id === Number(target.id)));
                task.completed = !task.completed;

                // if(target.classList.contains("completed")){
                //   target.classList.remove("completed");
                // }
                // else{
                //   target.setAttribute('class',"completed");
                // }
            }
            else if (target.className == 'del') {
                target.parentElement.remove();
                tasks = tasks.filter(t => (t.id !== Number(target.parentElement.id)));
                event.stopPropagation();
            }
            saveTask(tasks);
        });
    });
</script>

</html>
