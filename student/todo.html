<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: transparent;
            padding: 2.5rem;
            display: flex;
            justify-content: center;
            color: #f8fafc;
        }

        .outer {
            width: 100%;
            max-width: 650px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            padding: 3rem;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.4s ease-out;
            position: relative;
            overflow: hidden;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .outer::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 5px;
            background: linear-gradient(90deg, #6366f1, #3b82f6);
            opacity: 0.8;
        }

        h1 {
            margin-bottom: 2.5rem;
            font-weight: 700;
            font-size: 2rem;
            letter-spacing: -0.5px;
            text-align: left;
            background: linear-gradient(135deg, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        h1::before {
            content: '📋';
            font-size: 1.8rem;
        }

        .add {
            display: flex;
            gap: 12px;
            margin-bottom: 2.5rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s;
        }

        .add:focus-within {
            border-color: #6366f1;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        input {
            flex: 1;
            padding: 0.8rem 1rem;
            border: none;
            background: transparent;
            font-size: 1.05rem;
            outline: none;
            color: #ffffff;
        }

        input::placeholder {
            color: #64748b;
        }

        #bt1 {
            background: linear-gradient(135deg, #6366f1, #3b82f6);
            color: white;
            border: none;
            padding: 0 2rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        #bt1:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.5);
        }

        #bt1:active {
            transform: translateY(1px);
        }

        ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.25rem 1.5rem;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: #f8fafc;
            font-weight: 500;
            font-size: 1.05rem;
            cursor: pointer;
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        li::before {
            content: '';
            position: absolute;
            left: 0; top: 0;
            height: 100%; width: 4px;
            background: transparent;
            transition: 0.3s;
        }

        li:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
        }

        li:hover::before {
            background: #6366f1;
        }

        li span {
            flex: 1;
            text-align: left;
            word-break: break-word;
            margin-right: 15px;
            transition: 0.3s;
        }

        li.completed {
            background: rgba(0, 0, 0, 0.2);
            border-color: rgba(255, 255, 255, 0.03);
            box-shadow: none;
            opacity: 0.7;
        }

        li.completed span {
            text-decoration: line-through;
            color: #64748b;
        }

        li.completed::before {
            background: #10b981;
        }

        .del {
            color: #fca5a5;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            cursor: pointer;
            padding: 8px 14px;
            border-radius: 10px;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            margin-left: auto;
            flex-shrink: 0;
            font-weight: 600;
            font-size: 0.95rem;
            z-index: 10;
        }

        .del:hover {
            background: rgba(239, 68, 68, 0.2);
            color: #fee2e2;
            transform: scale(1.05);
            border-color: rgba(239, 68, 68, 0.4);
        }
    </style>
</head>

<body>
    <div class="outer">
        <h1 class="heading">Personal Tasks</h1>
        <div class="add">
            <input type="text" id="addtask" placeholder="Type a new task...">
            <button id="bt1">Add Task</button>
        </div>
        <ul class="list"></ul>
    </div>
</body>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        let ul = document.querySelector('ul');
        let btn = document.querySelector('button');
        let input = document.querySelector('input');

        let tasks = null;

        function retriveTasks() {
            tasks = JSON.parse(localStorage.getItem('eduLinkTasks')) || [];
            tasks.forEach(task => renderTask(task));
        }

        function renderTask(task) {
            createTask(task);
            console.log(task);
        }

        retriveTasks();

        function clearInput() {
            input.value = "";
        }

        function getValue() {
            return input.value;
        }

        function validateInput() {
            let task = getValue();
            if (task.trim() == '') {
                input.focus();
                return false;
            }
            return true;
        }

        function createTask(obj) {
            let inner = document.createElement('span');
            let li = document.createElement('li');
            inner.innerText = `${obj.text}`;

            let delBtn = document.createElement('button');
            delBtn.setAttribute('class', 'del');
            delBtn.innerText = 'Remove';

            li.setAttribute('id', String(obj.id));

            if (obj.completed) {
                li.setAttribute("class", "completed");
            }

            li.appendChild(inner);
            li.appendChild(delBtn);
            ul.prepend(li); // Add to top of list
        }

        function saveTask(arr) {
            localStorage.setItem('eduLinkTasks', JSON.stringify(arr))
        }

        btn.addEventListener('click', function (event) {
            if (!validateInput()) {
                return;
            }

            let obj = {
                id: Date.now(),
                text: getValue(),
                completed: false,
            }

            createTask(obj);

            tasks.push(obj);
            saveTask(tasks);
            clearInput();
        })

        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                btn.click();
            }
        });

        ul.addEventListener('click', function (event) {
            let target = event.target;

            if (target.tagName == "LI" || target.tagName == "SPAN") {
                let liElement = target.tagName == "SPAN" ? target.parentElement : target;
                liElement.classList.toggle("completed");

                let task = tasks.find(t => (t.id === Number(liElement.id)));
                if(task){
                    task.completed = !task.completed;
                    saveTask(tasks);
                }
            }
            else if (target.className == 'del') {
                const li = target.parentElement;
                li.style.transform = 'scale(0.95)';
                li.style.opacity = '0';
                setTimeout(() => {
                    li.remove();
                    tasks = tasks.filter(t => (t.id !== Number(li.id)));
                    event.stopPropagation();
                    saveTask(tasks);
                }, 200);
            }
        });
    });
</script>

</html>
