<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --secondary: #94a3b8;
            --bg-light: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-color: #f8fafc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a, #020617);
            background-size: 200% 200%;
            padding: 2.5rem;
            display: flex;
            justify-content: center;
            color: var(--text-color);
            min-height: 100vh;
        }

        .outer {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border-color);
            padding: 3rem;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h1 {
            color: var(--text-color);
            margin-bottom: 2.5rem;
            font-weight: 700;
            font-size: 2rem;
            letter-spacing: -0.5px;
            text-align: left;
        }

        .add {
            display: flex;
            gap: 12px;
            margin-bottom: 2.5rem;
            background: rgba(255, 255, 255, 0.02);
            padding: 8px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            transition: all 0.3s;
        }

        .add:focus-within {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        input {
            flex: 1;
            padding: 0.8rem 1rem;
            border: none;
            background: transparent;
            font-size: 1.05rem;
            outline: none;
            color: var(--text-color);
        }

        input::placeholder {
            color: #64748b;
        }

        #bt1 {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0 2rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
        }

        #bt1:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.3);
        }

        ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.25rem 1.5rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--text-color);
            font-weight: 500;
            font-size: 1.05rem;
            cursor: pointer;
            text-align: left;
        }

        li:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            border-color: rgba(99, 102, 241, 0.3);
            background: rgba(255, 255, 255, 0.05);
        }

        li span {
            flex: 1;
            text-align: left;
            word-break: break-word;
            margin-right: 15px;
        }

        li.completed {
            background: rgba(255, 255, 255, 0.01);
            border-color: var(--border-color);
            box-shadow: none;
            opacity: 0.6;
        }

        li.completed span {
            text-decoration: line-through;
            color: var(--secondary);
        }

        .del {
            background: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.2);
            cursor: pointer;
            padding: 8px 14px;
            border-radius: 10px;
            transition: all 0.2s;
            margin-left: auto;
            flex-shrink: 0;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .del:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.4);
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <div class="outer">
        <h1 class="heading">To Do List</h1>
        <div class="add">
            <input type="text" id="addtask" placeholder="Write a new task...">
            <button id="bt1">Add Task</button>
        </div>
        <ul class="list"></ul>
    </div>
</body>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        let ul = document.querySelector('ul');
        let btn = document.querySelector('button');
        let input = document.querySelector('input');

        let tasks = null;

        function retriveTasks() {
            tasks = JSON.parse(localStorage.getItem('tasks')) || [];
            tasks.forEach(task => renderTask(task));
        }

        function renderTask(task) {
            createTask(task);
            console.log(task);
        }

        retriveTasks();

        function clearInput() {
            input.value = "";
        }

        function getValue() {
            return input.value;
        }

        function validateInput() {
            let task = getValue();
            if (task.trim() == '') {
                return false;
            }
            return true;
        }

        function createTask(obj) {
            let inner = document.createElement('span');
            let li = document.createElement('li');
            inner.innerText = `${obj.text}`;

            let delBtn = document.createElement('button');
            delBtn.setAttribute('class', 'del');
            delBtn.innerText = 'Delete';

            li.setAttribute('id', String(obj.id));

            if (obj.completed) {
                li.setAttribute("class", "completed");
            }

            li.appendChild(inner);
            li.appendChild(delBtn);
            ul.appendChild(li);
        }

        function saveTask(arr) {
            localStorage.setItem('tasks', JSON.stringify(arr))
        }

        btn.addEventListener('click', function (event) {
            if (!validateInput()) {
                return;
            }

            let obj = {
                id: Date.now(),
                text: getValue(),
                completed: false,
            }

            createTask(obj);

            tasks.push(obj);
            saveTask(tasks);
            clearInput();
        })

        ul.addEventListener('click', function (event) {
            let target = event.target;

            if (target.tagName == "LI") {
                target.classList.toggle("completed");

                let task = tasks.find(t => (t.id === Number(target.id)));
                task.completed = !task.completed;

                // if(target.classList.contains("completed")){
                //   target.classList.remove("completed");
                // }
                // else{
                //   target.setAttribute('class',"completed");
                // }
            }
            else if (target.className == 'del') {
                target.parentElement.remove();
                tasks = tasks.filter(t => (t.id !== Number(target.parentElement.id)));
                event.stopPropagation();
            }
            saveTask(tasks);
        });
    });
</script>

</html>
