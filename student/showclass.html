<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduLink Student Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-light: rgba(99, 102, 241, 0.1);
            --primary-hover: #4f46e5;
            --secondary: #94a3b8;
            --white: #ffffff;
            --bg-light: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-color: #f8fafc;
            --sidebar-width: 280px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a, #020617);
            background-size: 200% 200%;
            animation: gradientShift 15s ease infinite alternate;
            color: var(--text-color);
            overflow: hidden;
            display: flex;
            height: 100vh;
        }

        @keyframes gradientShift {
            0% { background-position: 100% 0%; }
            100% { background-position: 0% 100%; }
        }

        /* Ambient background blobs */
        .blob {
            position: absolute;
            filter: blur(100px);
            z-index: 0;
            opacity: 0.3;
            border-radius: 50%;
            pointer-events: none;
        }

        .blob-1 { top: -10%; left: -10%; width: 450px; height: 450px; background: #6366f1; }
        .blob-2 { bottom: -10%; right: -10%; width: 550px; height: 550px; background: #3b82f6; }

        /* --- Sidebar --- */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: var(--sidebar-width);
            height: 100vh;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-right: 1px solid var(--border-color);
            padding: 2.5rem 1.5rem;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 3rem;
            font-weight: 700;
            font-size: 1.6rem;
            background: linear-gradient(135deg, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            padding-left: 10px;
        }

        .nav {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .nav-item {
            padding: 14px 18px;
            border-radius: 14px;
            color: var(--secondary);
            text-decoration: none;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: pointer;
            border: 1px solid transparent;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--white);
            transform: translateX(4px);
        }

        .nav-item.active {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(59, 130, 246, 0.2));
            border-color: rgba(99, 102, 241, 0.3);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transform: translateX(4px);
        }

        /* --- Main Content --- */
        .main-content {
            margin-left: var(--sidebar-width);
            width: calc(100vw - var(--sidebar-width));
            height: 100vh;
            display: flex;
            flex-direction: column;
            z-index: 10;
            position: relative;
        }

        /* --- Header --- */
        .top-header {
            height: 85px;
            background: rgba(255, 255, 255, 0.01);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border-color);
            padding: 0 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        #page-title {
            font-weight: 700;
            font-size: 1.6rem;
            color: var(--white);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-name {
            font-weight: 500;
            color: var(--secondary);
            font-size: 15px;
        }

        .logout-btn {
            background: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 8px 18px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            color: #fee2e2;
            transform: translateY(-2px);
        }

        /* --- Dynamic Viewport --- */
        #content-frame {
            flex: 1;
            width: 100%;
            height: calc(100vh - 85px);
            border: none;
            background: transparent;
        }

        #view-container {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid var(--border-color);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            animation: fadeIn 0.4s ease-out;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 4px;
            background: linear-gradient(90deg, #6366f1, #3b82f6);
            opacity: 0.8;
            transition: opacity 0.3s;
        }

        .card:hover {
            transform: translateY(-8px);
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--white);
            margin-bottom: 8px;
        }

        .card-badge {
            background: rgba(99, 102, 241, 0.2);
            color: #818cf8;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .card-footer {
            margin-top: 15px;
            font-size: 0.9rem;
            color: var(--secondary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-header {
            margin-bottom: 2rem;
        }

        .section-header p {
            font-size: 17px;
            color: var(--secondary);
        }

        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
            color: var(--secondary);
            font-size: 1.1rem;
            grid-column: 1/-1;
        }
        
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2); 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3); 
        }
    </style>
</head>

<body>

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <aside class="sidebar">
        <div class="brand">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
                <path d="M6 12v5c3 3 9 3 12 0v-5" />
            </svg>
            EduLink
        </div>
        <nav class="nav">
            <div class="nav-item active" onclick="loadContent('dashboard')">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7" rx="1"/>
                    <rect x="14" y="3" width="7" height="7" rx="1"/>
                    <rect x="14" y="14" width="7" height="7" rx="1"/>
                    <rect x="3" y="14" width="7" height="7" rx="1"/>
                </svg>
                My Classes
            </div>
            <div class="nav-item" onclick="loadContent('join')">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                    <circle cx="8.5" cy="7" r="4" />
                    <line x1="20" y1="8" x2="20" y2="14" />
                    <line x1="17" y1="11" x2="23" y2="11" />
                </svg>
                Join a Class
            </div>
            <div class="nav-item" onclick="loadContent('todo')">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 11 12 14 22 4" />
                    <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
                </svg>
                To-Do List
            </div>
        </nav>
    </aside>

    <main class="main-content">
        <header class="top-header">
            <div>
                <h2 id="page-title">Joined Classes</h2>
            </div>
            <div class="user-info">
                <span style="cursor: pointer; display: flex; align-items: center; gap: 8px; font-weight: 500;" onclick="window.location.href='help.html'">Help ❓</span>
                <span class="user-name" id="userName">Student</span>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </header>

        <div id="view-container">
            <!-- Dynamic Content Loaded Here -->
            <div id="dashboard-view">
                <div class="section-header">
                    <p>Welcome back! Select a class to view its dashboard.</p>
                </div>
                <div id="classesList" class="dashboard-grid">
                    <div class="loading-spinner">Fetching your classes...</div>
                </div>
            </div>

            <iframe id="content-frame" style="display: none;"></iframe>
        </div>
    </main>

    <script>
        const API_BASE = "https://edulink-backend-o3hw.onrender.com/api/v1";

        // Auth Check
        (async function checkAuth() {
            try {
                const res = await fetch(`${API_BASE}/currentUser`, {
                    method: "POST",
                    credentials: "include",
                });
                if (!res.ok) {
                    window.location.href = "../LOGIN.html";
                }
                const data = await res.json();
                if (data.success) {
                    document.getElementById('userName').innerText = data.user.fullname;
                    fetchClasses();
                }
            } catch (error) {
                window.location.href = "../LOGIN.html";
            }
        })();

        async function fetchClasses() {
            const list = document.getElementById('classesList');
            try {
                const res = await fetch(`${API_BASE}/student/joined-classes`, { credentials: "include" });
                const data = await res.json();

                if (data.success && data.data.length > 0) {
                    list.innerHTML = "";
                    data.data.forEach(cls => {
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.onclick = () => window.location.href = `studentview.html?classId=${cls._id}`;
                        card.innerHTML = `
                            <div class="card-header">
                                <span class="card-badge">${cls.code}</span>
                                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--secondary)"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                            </div>
                            <h3 class="card-title">${cls.name}</h3>
                            <div class="card-footer">
                                
                                <span>Academic Year: ${cls.year}</span>
                            </div>
                        `;
                        list.appendChild(card);
                    });
                } else {
                    list.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 60px; color: var(--secondary); background: var(--card-bg); border-radius: 20px; border: 1px dashed var(--border-color);">
                        <p style="font-size: 1.1rem; margin-bottom: 20px;">You haven't joined any classes yet.</p>
                        <button class="logout-btn" style="background: linear-gradient(135deg, #6366f1, #3b82f6); color: white; border: none; padding: 12px 24px;" onclick="loadContent('join')">Find a Class</button>
                    </div>`;
                }
            } catch (error) {
                list.innerHTML = `<div style="color: #ef4444; grid-column: 1/-1; text-align: center; padding: 40px;">Error fetching classes. Please check your connection.</div>`;
            }
        }

        function loadContent(type) {
            const frame = document.getElementById('content-frame');
            const dashboard = document.getElementById('dashboard-view');
            const navItems = document.querySelectorAll('.nav-item');
            const pageTitle = document.getElementById('page-title');

            navItems.forEach(item => item.classList.remove('active'));

            if (type === 'dashboard') {
                frame.style.display = 'none';
                dashboard.style.display = 'block';
                navItems[0].classList.add('active');
                pageTitle.innerText = "Joined Classes";
                fetchClasses();
            } else if (type === 'join') {
                dashboard.style.display = 'none';
                frame.style.display = 'block';
                frame.src = "joinclass.html";
                navItems[1].classList.add('active');
                pageTitle.innerText = "Find New Class";
            } else if (type === 'todo') {
                dashboard.style.display = 'none';
                frame.style.display = 'block';
                frame.src = "todo.html";
                navItems[2].classList.add('active');
                pageTitle.innerText = "Personal Tasks";
            }
        }

        async function logout() {
            try {
                await fetch(`${API_BASE}/logout/student`, { method: "POST", credentials: "include" });
                window.location.href = "../LOGIN.html";
            } catch (err) {
                alert("Logout failed");
            }
        }
    </script>
</body>

</html>
