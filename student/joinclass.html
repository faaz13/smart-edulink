<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join a Class</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --secondary: #94a3b8;
            --white: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-color: #f8fafc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a, #020617);
            background-size: 200% 200%;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
            color: var(--text-color);
        }

        .join-card {
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            padding: 2.5rem;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h2 {
            color: var(--text-color);
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        p {
            color: var(--secondary);
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        input {
            width: 100%;
            padding: 1rem 1.25rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-size: 1rem;
            margin-bottom: 1.5rem;
            outline: none;
            color: var(--text-color);
            transition: all 0.3s;
        }

        input:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        input::placeholder {
            color: #64748b;
        }

        .btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .btn:disabled {
            background: #475569;
            cursor: not-allowed;
        }

        #message {
            margin-top: 1rem;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .success {
            color: #10b981;
        }

        .error {
            color: #ef4444;
        }
    </style>
</head>

<body>
    <div class="join-card">
        <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2"
            style="margin-bottom: 1rem;">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
            <circle cx="8.5" cy="7" r="4" />
            <line x1="20" y1="8" x2="20" y2="14" />
            <line x1="17" y1="11" x2="23" y2="11" />
        </svg>
        <h2>Join a Class</h2>
        <p>Enter the unique code provided by your teacher to access the classroom.</p>

        <input type="text" id="classCode" placeholder="Class Code (e.g. CS101)" maxlength="10">
        <button class="btn" onclick="join()">Join Classroom</button>
        <div id="message"></div>
    </div>

    <script>
        const API_BASE = "https://edulink-backend-o3hw.onrender.com/api/v1";

        async function join() {
            const code = document.getElementById('classCode').value.trim();
            const msg = document.getElementById('message');
            const btn = document.querySelector('.btn');

            if (!code) return;

            msg.innerText = "";
            btn.disabled = true;
            btn.innerText = "Joining...";

            try {
                const res = await fetch(`${API_BASE}/student/join-class`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "include",
                    body: JSON.stringify({ classCode: code })
                });

                const data = await res.json();

                if (res.ok) {
                    msg.className = "success";
                    msg.innerText = "Successfully joined! Redirecting...";
                    setTimeout(() => {
                        window.parent.loadContent('dashboard');
                    }, 1500);
                } else {
                    msg.className = "error";
                    msg.innerText = data.message || "Failed to join class";
                }
            } catch (err) {
                msg.className = "error";
                msg.innerText = "Server error. Try again later.";
            } finally {
                btn.disabled = false;
                btn.innerText = "Join Classroom";
            }
        }
    </script>
</body>

</html>
