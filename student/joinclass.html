<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join a Class</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --secondary: #0ea5e9;
      --bg-dark: #020617;
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-dim: #94a3b8;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top right, #1e1b4b, #0f172a, #020617);
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: var(--text-main);
      overflow: hidden;
      position: relative;
    }

    .blob {
      position: absolute;
      filter: blur(80px);
      z-index: 0;
      opacity: 0.2;
      border-radius: 50%;
      pointer-events: none;
    }

    .blob-1 { top: -10%; left: -5%; width: 400px; height: 400px; background: #4f46e5; }
    .blob-2 { bottom: -10%; right: -5%; width: 500px; height: 500px; background: #0ea5e9; }

    .join-card {
      background: var(--glass-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      padding: 3.5rem;
      border-radius: 30px;
      border: 1px solid var(--glass-border);
      width: 100%;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.6);
      position: relative;
      z-index: 1;
    }

    h2 {
      font-size: 2rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.75rem;
      letter-spacing: -0.5px;
    }

    p {
      color: var(--text-dim);
      margin-bottom: 2.5rem;
      font-size: 1rem;
      line-height: 1.6;
    }

    input {
      width: 100%;
      padding: 1rem 1.5rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      font-size: 1rem;
      margin-bottom: 2rem;
      outline: none;
      color: #fff;
      transition: var(--transition);
      text-align: center;
      letter-spacing: 2px;
      font-weight: 600;
    }

    input:focus {
      border-color: var(--primary);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
    }

    input::placeholder {
      color: #4b5563;
      letter-spacing: normal;
      font-weight: 400;
    }

    .btn {
      width: 100%;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      border: none;
      padding: 1.1rem;
      border-radius: 16px;
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
      position: relative;
      overflow: hidden;
    }

    .btn::after {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
      transform: rotate(45deg);
      transition: 0.8s;
    }

    .btn:hover::after {
      left: 100%;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 30px -5px rgba(99, 102, 241, 0.6);
    }

    .btn:disabled {
      background: #334155;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    #message {
      margin-top: 1.5rem;
      font-size: 0.95rem;
      font-weight: 600;
      min-height: 1.5rem;
    }

    .success { color: #10b981; }
    .error { color: #ef4444; }
    </style>
</head>

<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
    <div class="join-card">
        <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2"
            style="margin-bottom: 1rem;">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
            <circle cx="8.5" cy="7" r="4" />
            <line x1="20" y1="8" x2="20" y2="14" />
            <line x1="17" y1="11" x2="23" y2="11" />
        </svg>
        <h2>Join a Class</h2>
        <p>Enter the unique code provided by your teacher to access the classroom.</p>

        <input type="text" id="classCode" placeholder="Class Code (e.g. CS101)" maxlength="10">
        <button class="btn" onclick="join()">Join Classroom</button>
        <div id="message"></div>
    </div>

    <script>
        const API_BASE = "https://edulink-backend-o3hw.onrender.com/api/v1";

        async function join() {
            const code = document.getElementById('classCode').value.trim();
            const msg = document.getElementById('message');
            const btn = document.querySelector('.btn');

            if (!code) return;

            msg.innerText = "";
            btn.disabled = true;
            btn.innerText = "Joining...";

            try {
                const res = await fetch(`${API_BASE}/student/join-class`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "include",
                    body: JSON.stringify({ classCode: code })
                });

                const data = await res.json();

                if (res.ok) {
                    msg.className = "success";
                    msg.innerText = "Successfully joined! Redirecting...";
                    setTimeout(() => {
                        window.parent.loadContent('dashboard');
                    }, 1500);
                } else {
                    msg.className = "error";
                    msg.innerText = data.message || "Failed to join class";
                }
            } catch (err) {
                msg.className = "error";
                msg.innerText = "Server error. Try again later.";
            } finally {
                btn.disabled = false;
                btn.innerText = "Join Classroom";
            }
        }
    </script>
</body>

</html>
