<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join a Class</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
            color: #f8fafc;
        }

        .join-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            padding: 3rem;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 480px;
            text-align: center;
            animation: fadeIn 0.4s ease-out;
            position: relative;
            overflow: hidden;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .join-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 5px;
            background: linear-gradient(90deg, #6366f1, #3b82f6);
        }

        .icon-wrapper {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(59, 130, 246, 0.2));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        h2 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
            color: #ffffff;
        }

        p {
            color: #94a3b8;
            margin-bottom: 2.5rem;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        input {
            width: 100%;
            padding: 1rem 1.25rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border-radius: 14px;
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            outline: none;
            transition: all 0.3s;
            text-align: center;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        input::placeholder {
            color: #64748b;
            text-transform: none;
            letter-spacing: normal;
        }

        input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        .btn {
            width: 100%;
            background: linear-gradient(135deg, #ffffff, #f1f5f9);
            color: #0f172a;
            border: none;
            padding: 1rem;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 10px 20px -5px rgba(255, 255, 255, 0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(255, 255, 255, 0.3);
            background: #ffffff;
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn:disabled {
            background: rgba(255, 255, 255, 0.1);
            color: #64748b;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #message {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 10px;
            border-radius: 10px;
            display: none;
        }

        .success {
            background: rgba(16, 185, 129, 0.1);
            color: #6ee7b7;
            border: 1px solid rgba(16, 185, 129, 0.2);
            display: block !important;
        }

        .error {
            background: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.2);
            display: block !important;
        }
    </style>
</head>

<body>
    <div class="join-card">
        <div class="icon-wrapper">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="2">
                <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                <circle cx="8.5" cy="7" r="4" />
                <line x1="20" y1="8" x2="20" y2="14" />
                <line x1="17" y1="11" x2="23" y2="11" />
            </svg>
        </div>
        <h2>Join a Class</h2>
        <p>Enter the unique code provided by your teacher to access the classroom dashboard.</p>

        <input type="text" id="classCode" placeholder="Enter Class Code" maxlength="10">
        <button class="btn" onclick="join()">Join Classroom</button>
        <div id="message"></div>
    </div>

    <script>
        const API_BASE = "https://edulink-backend-o3hw.onrender.com/api/v1";

        async function join() {
            const code = document.getElementById('classCode').value.trim();
            const msg = document.getElementById('message');
            const btn = document.querySelector('.btn');

            if (!code) {
                msg.className = "error";
                msg.innerText = "Please enter a class code.";
                return;
            }

            msg.className = "";
            msg.innerText = "";
            btn.disabled = true;
            btn.innerText = "Authenticating Code...";

            try {
                const res = await fetch(`${API_BASE}/student/join-class`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "include",
                    body: JSON.stringify({ classCode: code })
                });

                const data = await res.json();

                if (res.ok) {
                    msg.className = "success";
                    msg.innerText = "Classroom joined successfully! Redirecting...";
                    setTimeout(() => {
                        window.parent.loadContent('dashboard');
                    }, 1500);
                } else {
                    msg.className = "error";
                    msg.innerText = data.message || "Failed to join class. Invalid code.";
                }
            } catch (err) {
                msg.className = "error";
                msg.innerText = "Server connection error. Please try again later.";
            } finally {
                if (msg.className !== "success") {
                    btn.disabled = false;
                    btn.innerText = "Join Classroom";
                }
            }
        }
    </script>
</body>

</html>
