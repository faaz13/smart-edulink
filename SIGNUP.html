<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduLink – Sign Up</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    min-height: 100vh;
    background: radial-gradient(circle at top right, #1e1b4b, #0f172a, #020617);
    background-size: 200% 200%;
    animation: gradientShift 15s ease infinite alternate;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px;
    color: #f8fafc;
    overflow-x: hidden;
    position: relative;
}

@keyframes gradientShift {
    0% { background-position: 100% 0%; }
    100% { background-position: 0% 100%; }
}

/* Ambient blobs */
.blob {
    position: absolute;
    filter: blur(80px);
    z-index: 0;
    opacity: 0.5;
    border-radius: 50%;
    animation: float 10s infinite ease-in-out alternate;
}

.blob-1 {
    top: 10%; left: -5%;
    width: 400px; height: 400px;
    background: #4f46e5;
}

.blob-2 {
    bottom: -10%; right: 5%;
    width: 500px; height: 500px;
    background: #0ea5e9;
    animation-delay: -3s;
}

@keyframes float {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(40px, -30px) scale(1.1); }
}

.container {
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    width: 100%;
    max-width: 900px;
    padding: 50px 40px;
    border-radius: 30px;
    border: 1px solid rgba(255, 255, 255, 0.05);
    box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
    position: relative;
    z-index: 1;
    animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

.brand {
    text-align: center;
    margin-bottom: 35px;
}

.brand img {
    width: 80px;
    height: 80px;
    border-radius: 20px;
    background: #ffffff;
    padding: 8px;
    box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
    transition: transform 0.3s ease;
}

.brand img:hover {
    transform: scale(1.05) rotate(5deg);
}

.brand h1 {
    font-size: 32px;
    font-weight: 700;
    margin-top: 15px;
    background: linear-gradient(135deg, #ffffff, #cbd5e1);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.role-switch {
    display: flex;
    background: rgba(0, 0, 0, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 40px;
    padding: 8px;
    margin-bottom: 40px;
    gap: 8px;
    max-width: 400px;
    margin-left: auto;
    margin-right: auto;
}

.role-btn {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 30px;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    background: transparent;
    color: #94a3b8;
    transition: all 0.3s ease;
}

.role-btn.active {
    background: linear-gradient(135deg, #6366f1, #3b82f6);
    color: #ffffff;
    box-shadow: 0 6px 15px rgba(59, 130, 246, 0.4);
}

.form-section {
    display: none;
    animation: fadeIn 0.4s ease;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px 40px;
}

.field {
    margin-bottom: 20px;
}

label {
    font-size: 13px;
    margin-bottom: 8px;
    display: block;
    color: #cbd5e1;
    font-weight: 500;
}

input {
    width: 100%;
    padding: 14px 18px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #ffffff;
    font-size: 14px;
    transition: all 0.3s;
    outline: none;
}

input::placeholder {
    color: #64748b;
}

input:focus {
    background: rgba(255, 255, 255, 0.08);
    border-color: #6366f1;
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
}

input.error {
    border-color: #ef4444;
    box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
}

input.success {
    border-color: #10b981;
    box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
}

.submit-btn {
    margin-top: 40px;
    text-align: center;
}

.submit-btn button {
    padding: 16px 50px;
    border: none;
    border-radius: 50px;
    background: linear-gradient(135deg, #ffffff, #f1f5f9);
    color: #0f172a;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    box-shadow: 0 10px 25px -5px rgba(255, 255, 255, 0.2);
    min-width: 250px;
}

.submit-btn button:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 35px -5px rgba(255, 255, 255, 0.3);
    background: #ffffff;
}

.submit-btn button:active {
    transform: translateY(1px);
}

.submit-btn button:disabled {
    opacity: 0.7;
    cursor: not-allowed;
    transform: none;
}

.message-box {
    font-size: 14px;
    margin-bottom: 25px;
    padding: 14px 18px;
    border-radius: 12px;
    font-weight: 500;
    display: none;
    text-align: center;
    backdrop-filter: blur(10px);
}

.error-box {
    background: rgba(239, 68, 68, 0.1);
    color: #fca5a5;
    border: 1px solid rgba(239, 68, 68, 0.2);
}

.success-box {
    background: rgba(16, 185, 129, 0.1);
    color: #6ee7b7;
    border: 1px solid rgba(16, 185, 129, 0.2);
}

.extra {
    text-align: center;
    margin-top: 30px;
    font-size: 14px;
    color: #94a3b8;
}

.extra a {
    color: #60a5fa;
    font-weight: 600;
    text-decoration: none;
    margin-left: 5px;
    transition: 0.3s;
}

.extra a:hover {
    color: #93c5fd;
    text-decoration: underline;
}

@media(max-width: 768px) {
    .form-grid {
        grid-template-columns: 1fr;
        gap: 0;
    }
    .container {
        padding: 40px 25px;
    }
}
</style>
</head>

<body>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<div class="container">

    <div class="brand">
        <img src="https://raw.githubusercontent.com/faaz13/LOGO/main/LOGO.jpeg" alt="EduLink Logo">
        <h1>Create Account</h1>
    </div>

    <div class="role-switch">
        <button type="button" class="role-btn active" id="studentBtn">Student</button>
        <button type="button" class="role-btn" id="teacherBtn">Teacher</button>
    </div>

    <!-- STUDENT FORM -->
    <form id="studentForm" class="form-section" style="display:block;">
        <div class="message-box" id="studentMessage"></div>

        <div class="form-grid">
            <div>
                <div class="field">
                    <label>Username</label>
                    <input type="text" id="sUsername" placeholder="Enter unique username">
                </div>
                <div class="field">
                    <label>Full Name</label>
                    <input type="text" id="sFullname" placeholder="Enter your full name">
                </div>
                <div class="field">
                    <label>Institute Roll Number</label>
                    <input type="text" id="sRoll" placeholder="e.g. 21BXX001">
                </div>
                <div class="field">
                    <label>Mobile Number</label>
                    <input type="text" id="sMobile" placeholder="Contact number">
                </div>
            </div>
            <div>
                <div class="field">
                    <label>Email</label>
                    <input type="email" id="sEmail" placeholder="Academic email address">
                </div>
                <div class="field">
                    <label>Branch</label>
                    <input type="text" id="sBranch" placeholder="e.g. Computer Science">
                </div>
                <div class="field">
                    <label>Password</label>
                    <input type="password" id="sPassword" placeholder="Minimum 6 characters">
                </div>
                <div class="field">
                    <label>Confirm Password</label>
                    <input type="password" id="sConfirm" placeholder="Verify password">
                </div>
            </div>
        </div>

        <div class="submit-btn">
            <button type="submit" id="studentSubmit">Create Student Account</button>
        </div>
        <div class="extra">
            Already have an account? <a href="LOGIN.html">Log In</a>
        </div>
    </form>

    <!-- TEACHER FORM -->
    <form id="teacherForm" class="form-section">
        <div class="message-box" id="teacherMessage"></div>

        <div class="form-grid">
            <div>
                <div class="field">
                    <label>Username</label>
                    <input type="text" id="tUsername" placeholder="Enter unique username">
                </div>
                <div class="field">
                    <label>Full Name</label>
                    <input type="text" id="tFullname" placeholder="Enter your full name">
                </div>
                <div class="field">
                    <label>Department</label>
                    <input type="text" id="tDepartment" placeholder="e.g. Computer Science">
                </div>
                <div class="field">
                    <label>Mobile Number</label>
                    <input type="text" id="tMobile" placeholder="Contact number">
                </div>
            </div>
            <div>
                <div class="field">
                    <label>Email</label>
                    <input type="email" id="tEmail" placeholder="Faculty email address">
                </div>
                <div class="field">
                    <label>Password</label>
                    <input type="password" id="tPassword" placeholder="Minimum 6 characters">
                </div>
                <div class="field">
                    <label>Confirm Password</label>
                    <input type="password" id="tConfirm" placeholder="Verify password">
                </div>
            </div>
        </div>

        <div class="submit-btn">
            <button type="submit" id="teacherSubmit">Create Teacher Account</button>
        </div>
        <div class="extra">
            Already have an account? <a href="LOGIN.html">Log In</a>
        </div>
    </form>

</div>

<script>
const API_BASE = "https://edulink-backend-o3hw.onrender.com/api/v1";

const studentBtn = document.getElementById("studentBtn");
const teacherBtn = document.getElementById("teacherBtn");
const studentForm = document.getElementById("studentForm");
const teacherForm = document.getElementById("teacherForm");

studentBtn.onclick = () => {
    studentBtn.classList.add("active");
    teacherBtn.classList.remove("active");
    studentForm.style.display = "block";
    teacherForm.style.display = "none";
};

teacherBtn.onclick = () => {
    teacherBtn.classList.add("active");
    studentBtn.classList.remove("active");
    teacherForm.style.display = "block";
    studentForm.style.display = "none";
};

function showMessage(id,type,text){
    const box=document.getElementById(id);
    box.className="message-box "+(type==="error"?"error-box":"success-box");
    box.innerText=text;
    box.style.display="block";
}

function clearMessage(id){
    document.getElementById(id).style.display="none";
}

async function handleSignup(role){
    const isStudent = role==="student";
    const messageId = isStudent ? "studentMessage" : "teacherMessage";
    clearMessage(messageId);

    const button = document.getElementById(isStudent?"studentSubmit":"teacherSubmit");
    button.disabled=true;
    button.innerText="Creating Account...";

    let payload={};

    if(isStudent){
        payload={
            username:sUsername.value.trim(),
            fullname:sFullname.value.trim(),
            collegerollnumber:sRoll.value.trim(),
            mobilenumber:sMobile.value.trim(),
            email:sEmail.value.trim(),
            branch:sBranch.value.trim(),
            password:sPassword.value.trim(),
            confirmPassword:sConfirm.value.trim()
        };
    }else{
        payload={
            username:tUsername.value.trim(),
            fullname:tFullname.value.trim(),
            department:tDepartment.value.trim(),
            mobilenumber:tMobile.value.trim(),
            email:tEmail.value.trim(),
            password:tPassword.value.trim(),
            confirmPassword:tConfirm.value.trim()
        };
    }

    try{
        const response = await fetch(`${API_BASE}/register/${role}`,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify(payload)
        });

        const data = await response.json();

        if(response.ok){
            showMessage(messageId,"success","Account created successfully! You can now log in.");
            button.innerText="Success!";
            if(role == "student"){
                studentForm.reset();
            }
            else {
                teacherForm.reset();
            }
            setTimeout(() => {
                window.location.href = "LOGIN.html";
            }, 1500);
        }else{
            showMessage(messageId,"error",data.message || "Registration failed");
        }

    }catch(err){
        showMessage(messageId,"error","Server not reachable. Please check your connection.");
    }

    if(button.innerText !== "Success!") {
        button.disabled=false;
        button.innerText=isStudent?"Create Student Account":"Create Teacher Account";
    }
}

studentForm.onsubmit = e=>{
    e.preventDefault();
    handleSignup("student");
};

teacherForm.onsubmit = e=>{
    e.preventDefault();
    handleSignup("teacher");
};
</script>

</body>
</html>
