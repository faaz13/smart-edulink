<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduLink – Sign Up</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#4f46e5,#06b6d4);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    color:#fff;
}

.container{
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    width:100%;
    max-width:950px;
    padding:40px;
    border-radius:20px;
    box-shadow:0 20px 45px rgba(0,0,0,0.3);
}

.brand{
    text-align:center;
    margin-bottom:25px;
}

.brand img{
    width:90px;
    height:90px;
    border-radius:14px;
    background:#fff;
    padding:6px;
}

.brand h1{
    font-size:30px;
    margin-top:10px;
}

.role-switch{
    display:flex;
    gap:15px;
    margin:25px 0;
}

.role-btn{
    flex:1;
    padding:12px;
    border:none;
    border-radius:30px;
    font-weight:600;
    cursor:pointer;
    background:rgba(255,255,255,0.25);
    color:#fff;
    transition:0.3s;
}

.role-btn.active{
    background:#fff;
    color:#4f46e5;
}

.form-section{
    display:none;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:30px;
}

.field{
    margin-bottom:16px;
}

label{
    font-size:13px;
    margin-bottom:5px;
    display:block;
}

input{
    width:100%;
    padding:11px 14px;
    border-radius:12px;
    border:none;
    outline:none;
    font-size:14px;
}

input.error{
    border:2px solid #ff4d4d;
}

input.success{
    border:2px solid #4caf50;
}

.submit-btn{
    margin-top:25px;
    text-align:center;
}

.submit-btn button{
    padding:13px 35px;
    border:none;
    border-radius:30px;
    background:#fff;
    color:#4f46e5;
    font-weight:600;
    cursor:pointer;
}

.submit-btn button:disabled{
    opacity:0.7;
    cursor:not-allowed;
}

.message-box{
    font-size:14px;
    margin-bottom:15px;
    padding:10px 12px;
    border-radius:10px;
    font-weight:600;
    display:none;
}

.error-box{
    background:rgba(255,77,77,0.35);
    border:1px solid #ff4d4d;
    box-shadow:0 0 12px rgba(255,77,77,0.6);
}

.success-box{
    background:rgba(76,175,80,0.35);
    border:1px solid #4caf50;
    box-shadow:0 0 12px rgba(76,175,80,0.6);
}

@media(max-width:768px){
    .form-grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="brand">
        <img src="https://raw.githubusercontent.com/faaz13/LOGO/main/LOGO.jpeg">
        <h1>Create Your Account</h1>
    </div>

    <div class="role-switch">
        <button type="button" class="role-btn active" id="studentBtn">Student</button>
        <button type="button" class="role-btn" id="teacherBtn">Teacher</button>
    </div>

    <!-- STUDENT FORM -->
    <form id="studentForm" class="form-section" style="display:block;">
        <div class="message-box" id="studentMessage"></div>

        <div class="form-grid">
            <div>
                <div class="field">
                    <label>Username</label>
                    <input type="text" id="sUsername" placeholder="Enter your username">
                </div>
                <div class="field">
                    <label>Full Name</label>
                    <input type="text" id="sFullname" placeholder="Enter your fullname">
                </div>
                <div class="field">
                    <label>Institute Roll Number</label>
                    <input type="text" id="sRoll" placeholder="Enter your Institute Roll No.">
                </div>
                <div class="field">
                    <label>Mobile Number</label>
                    <input type="text" id="sMobile" placeholder="Enter your Mobile no.">
                </div>
            </div>
            <div>
                <div class="field">
                    <label>Email</label>
                    <input type="email" id="sEmail" placeholder="Enter your email">
                </div>
                <div class="field">
                    <label>Branch</label>
                    <input type="text" id="sBranch" placeholder="Enter your Branch name">
                </div>
                <div class="field">
                    <label>Password</label>
                    <input type="password" id="sPassword" placeholder="Enter your password">
                </div>
                <div class="field">
                    <label>Confirm Password</label>
                    <input type="password" id="sConfirm" placeholder="Rewrite the above password">
                </div>
            </div>
        </div>

        <div class="submit-btn">
            <button type="submit" id="studentSubmit">Create Student Account</button>
        </div>
    </form>

    <!-- TEACHER FORM -->
    <form id="teacherForm" class="form-section">
        <div class="message-box" id="teacherMessage"></div>

        <div class="form-grid">
            <div>
                <div class="field">
                    <label>Username</label>
                    <input type="text" id="tUsername" placeholder="Enter your username">
                </div>
                <div class="field">
                    <label>Full Name</label>
                    <input type="text" id="tFullname" placeholder="Enter your fullname">
                </div>
                <div class="field">
                    <label>Department</label>
                    <input type="text" id="tDepartment" placeholder="Enter your department name">
                </div>
                <div class="field">
                    <label>Mobile Number</label>
                    <input type="text" id="tMobile" placeholder="Enter your mobile no.">
                </div>
            </div>
            <div>
                <div class="field">
                    <label>Email</label>
                    <input type="email" id="tEmail" placeholder="Enter your email">
                </div>
                <div class="field">
                    <label>Password</label>
                    <input type="password" id="tPassword"  placeholder="Enter your password ">
                </div>
                <div class="field">
                    <label>Confirm Password</label>
                    <input type="password" id="tConfirm"  placeholder="Rewrite the same paasword">
                </div>
            </div>
        </div>

        <div class="submit-btn">
            <button type="submit" id="teacherSubmit">Create Teacher Account</button>
        </div>
    </form>

</div>

<script>
const API_BASE = "https://edulink-backend-o3hw.onrender.com/api/v1";

const studentBtn = document.getElementById("studentBtn");
const teacherBtn = document.getElementById("teacherBtn");
const studentForm = document.getElementById("studentForm");
const teacherForm = document.getElementById("teacherForm");

studentBtn.onclick = () => {
    studentBtn.classList.add("active");
    teacherBtn.classList.remove("active");
    studentForm.style.display = "block";
    teacherForm.style.display = "none";
};

teacherBtn.onclick = () => {
    teacherBtn.classList.add("active");
    studentBtn.classList.remove("active");
    teacherForm.style.display = "block";
    studentForm.style.display = "none";
};

function showMessage(id,type,text){
    const box=document.getElementById(id);
    box.className="message-box "+(type==="error"?"error-box":"success-box");
    box.innerText=text;
    box.style.display="block";
}

function clearMessage(id){
    document.getElementById(id).style.display="none";
}

async function handleSignup(role){
    const isStudent = role==="student";
    const messageId = isStudent ? "studentMessage" : "teacherMessage";
    clearMessage(messageId);

    const button = document.getElementById(isStudent?"studentSubmit":"teacherSubmit");
    button.disabled=true;
    button.innerText="Creating...";

    let payload={};

    if(isStudent){
        payload={
            username:sUsername.value.trim(),
            fullname:sFullname.value.trim(),
            collegerollnumber:sRoll.value.trim(),
            mobilenumber:sMobile.value.trim(),
            email:sEmail.value.trim(),
            branch:sBranch.value.trim(),
            password:sPassword.value.trim(),
            confirmPassword:sConfirm.value.trim()
        };
    }else{
        payload={
            username:tUsername.value.trim(),
            fullname:tFullname.value.trim(),
            department:tDepartment.value.trim(),
            mobilenumber:tMobile.value.trim(),
            email:tEmail.value.trim(),
            password:tPassword.value.trim(),
            confirmPassword:tConfirm.value.trim()
        };
    }

    try{
        const response = await fetch(`${API_BASE}/register/${role}`,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify(payload)
        });

        const data = await response.json();

        if(response.ok){
            showMessage(messageId,"success","Account created successfully!");
            button.innerText="Success!";
            if(role == "student"){
                studentForm.reset();
            }
            else {
                teacherForm.reset();
            }
        }else{
            showMessage(messageId,"error",data.message || "Registration failed");
        }

    }catch(err){
        showMessage(messageId,"error","Server not reachable");
    }

    button.disabled=false;
    button.innerText=isStudent?"Create Student Account":"Create Teacher Account";
}

studentForm.onsubmit = e=>{
    e.preventDefault();
    handleSignup("student");
};

teacherForm.onsubmit = e=>{
    e.preventDefault();
    handleSignup("teacher");
};
</script>

</body>
</html>
