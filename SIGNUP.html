<!DOCTYPE html>
<html>

<head>
    <title>EduLink | Sign Up</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #divide {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            width: 72%;
            max-width: 900px;
            padding: 40px 50px;
            border-radius: 20px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.3);
            color: #ffffff;
        }


        /* Header */
        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand h1 {
            color: #ffffff;
        }


        .brand p {
            color: #e0e7ff;
        }


        /* Role switch */
        .role-switch {
            display: flex;
            gap: 15px;
            margin: 30px 0;
        }

        .role-btn {
            flex: 1;
            padding: 14px 0;
            border: none;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.25);
            color: #ffffff;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
        }


        .role-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.15);
        }

        .role-btn.active {
            background: #ffffff;
            color: #4f46e5;
        }


        /* Form section */
        #formSection {
            display: none;
            margin-top: 20px;
        }

        .section-title {
            color: #0f1218;
            font-size: 18px;
            margin-bottom: 25px;
        }

        .outer1 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        label {
            font-size: 15px;
            font-weight: 600;
            color: #374151;
            display: block;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 12px;
            border: none;
            font-size: 14px;
        }


        input:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.3);
        }


        .field {
            margin-bottom: 18px;
        }

        /* Submit */
        .submit-btn {
            text-align: center;
            margin-top: 35px;
        }

        .submit-btn a {
            background: #ffffff;
            color: #4f46e5;
        }


        .submit-btn a:hover {
            background: #e0e7ff;
        }


        @media (max-width: 768px) {
            #divide {
                width: 90%;
            }

            .outer1 {
                grid-template-columns: 1fr;
            }
        }

        img {
            height: 100px;
            width: 100px;
            position: relative;
            top: 40px;
        }

        #logo,
        img {
            display: inline-block;
        }
    </style>
</head>

<body>
    <div id="divide">

        <div class="brand">
            <img src="https://raw.githubusercontent.com/faaz13/LOGO/main/LOGO.jpeg">
            <h1 id="logo">EduLink</h1>
            <br><br>
            <p>Connect • Learn • Grow</p>
            <p>
            <h1>Sign Up as a</h1>
            </p>
        </div>

        <div class="role-switch">
            <button class="role-btn" id="studentBtn">Student</button>
            <button class="role-btn" id="teacherBtn">Teacher</button>
        </div>

        <!-- STUDENT SIGNUP -->
        <div id="studentForm" style="display:none;">
            <div class="section-title">Student Details</div>

            <div class="outer1">
                <div>
                    <div class="field">
                        <label>Full Name</label>
                        <input type="text" placeholder="Enter your name">
                    </div>

                    <div class="field">
                        <label>User Name</label>
                        <input type="text" placeholder="Choose a username">
                    </div>

                    <div class="field">
                        <label>College Roll No</label>
                        <input type="text" placeholder="Enter roll number">
                    </div>

                    <div class="field">
                        <label>Mobile Number</label>
                        <input type="text" placeholder="Enter mobile number">
                    </div>
                </div>

                <div>
                    <div class="field">
                        <label>Email</label>
                        <input type="email" placeholder="Enter your email">
                    </div>

                    <div class="field">
                        <label>Create Password</label>
                        <input type="password" minlength="7">
                    </div>

                    <div class="field">
                        <label>Confirm Password</label>
                        <input type="password" minlength="7">
                    </div>
                </div>
            </div>

            <div class="submit-btn">
                <a href="student-dashboard.html">Create Student Account</a>
            </div>
        </div>


        <!-- TEACHER SIGNUP -->
        <div id="teacherForm" style="display:none;">
            <div class="section-title">Teacher Details</div>

            <div class="outer1">
                <div>
                    <div class="field">
                        <label>Full Name</label>
                        <input type="text" placeholder="Enter your name">
                    </div>

                    <div class="field">
                        <label>Teacher ID</label>
                        <input type="text" placeholder="Enter Teacher ID">
                    </div>

                    <div class="field">
                        <label>Department</label>
                        <input type="text" placeholder="Enter department">
                    </div>

                    <div class="field">
                        <label>Mobile Number</label>
                        <input type="text" placeholder="Enter mobile number">
                    </div>
                </div>

                <div>
                    <div class="field">
                        <label>Email</label>
                        <input type="email" placeholder="Enter your email">
                    </div>

                    <div class="field">
                        <label>Create Password</label>
                        <input type="password" minlength="7">
                    </div>

                    <div class="field">
                        <label>Confirm Password</label>
                        <input type="password" minlength="7">
                    </div>
                </div>
            </div>

            <div class="submit-btn">
                <a href="teacher-dashboard.html">Create Teacher Account</a>
            </div>
        </div>
    </div>

    <script>
        const studentBtn = document.getElementById("studentBtn");
        const teacherBtn = document.getElementById("teacherBtn");

        const studentForm = document.getElementById("studentForm");
        const teacherForm = document.getElementById("teacherForm");

        studentBtn.addEventListener("click", () => {
            studentForm.style.display = "block";
            teacherForm.style.display = "none";

            studentBtn.classList.add("active");
            teacherBtn.classList.remove("active");
        });

        teacherBtn.addEventListener("click", () => {
            teacherForm.style.display = "block";
            studentForm.style.display = "none";

            teacherBtn.classList.add("active");
            studentBtn.classList.remove("active");
        });
    </script>

</body>

</html>
