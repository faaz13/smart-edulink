<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edu Link - Marks Report</title>

  <style>
    :root {
      --primary: #6366f1;
      --bg-light: #0f172a;
      --text-color: #f8fafc;
      --border-color: rgba(255, 255, 255, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      background: transparent;
      color: var(--text-color);
    }

    header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid var(--border-color);
    }

    header h1 {
      font-size: 24px;
      color: var(--text-color);
    }

    header p {
      font-size: 14px;
      color: #94a3b8;
    }

    .logout-btn {
      display: none;
    }

    .container {
      display: flex;
      min-height: calc(100vh - 90px);
    }

    .sidebar {
      width: 220px;
      padding: 20px;
      border-right: 1px solid var(--border-color);
    }

    .sidebar button {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      cursor: pointer;
    }

    .sidebar button:hover,
    .sidebar button.active {
      background: var(--primary);
      color: white;
    }

    .main {
      flex: 1;
      padding: 20px;
    }

    .top-controls {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    input[type="text"], input[type="number"] {
      padding: 7px 10px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      outline: none;
    }

    input[type="number"] {
      width: 80px;
    }

    .sort-btn {
      padding: 7px 10px;
      background: var(--primary);
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 100%;
    }

    th, td {
      border: 1px solid var(--border-color);
      padding: 6px;
      text-align: center;
    }

    th {
      background: rgba(99,102,241,0.2);
      color: var(--text-color);
    }

    .edit-btn, .save-btn, .cancel-btn {
      padding: 5px 10px;
      border: none;
      cursor: pointer;
      border-radius: 5px;
      margin: 0 2px;
    }

    .edit-btn { background: var(--primary); color: white; }
    .save-btn { background: #10B981; color: white; }
    .cancel-btn { background: #EF4444; color: white; }

    .highlight {
      background: rgba(16, 185, 129, 0.2) !important;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <header>
    <h1>Marks Report – NIT Kurukshetra</h1>
    <p>Edu Link Student Marks Portal</p>
    <!-- <button class="logout-btn" onclick="logout()">Logout</button> -->
  </header>

  <div class="container">
    <div class="sidebar">
      <button class="menu-btn active" onclick="loadCategory('mid1', this)">
        Mid 1 Marks
      </button>
      <button class="menu-btn" onclick="loadCategory('mid2', this)">
        Mid 2 Marks
      </button>
      <button class="menu-btn" onclick="loadCategory('teacherAssessment', this)">
        Teacher Assesment Marks
      </button>
      <button class="menu-btn" onclick="loadCategory('attendance', this)">
        Attendance Marks
      </button>
      <button class="menu-btn" onclick="loadCategory('endsem', this)">
        End Semester Marks
      </button>
      <button class="menu-btn" onclick="loadCategory('total', this)">
        Total
      </button>
    </div>

    <div class="main">
      <div class="top-controls">
        <input type="text" id="searchInput" placeholder="Search Student..." onkeyup="searchStudent()" />
        <button class="sort-btn" onclick="sortByMarks()">
          Sort by Marks
        </button>
      </div>

      <table id="marksTable">
        <thead>
          <tr>
            <th>Roll No.</th>
            <th>Max Marks</th>
            <th>Marks Obtained</th>
            <th>Total</th>
            <th>Percentage</th>
            <th>Edit</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script>
    // Immediate Auth Check
    (async function checkAuth() {
      try {
        const res = await fetch("https://edulink-backend-o3hw.onrender.com/api/v1/currentUser", {
          method: "POST",
          credentials: "include",
        });
        if (!res.ok) {
          window.top.location.href = "../login.html";
        }
      } catch (error) {
        window.top.location.href = "../login.html";
      }
    })();

    // Intercept all fetch calls to handle 401 Unauthorized globally
    const originalFetch = window.fetch;
    window.fetch = async (...args) => {
      const response = await originalFetch(...args);
      if (response.status === 401) {
        window.top.location.href = "../login.html";
      }
      return response;
    };

    const params = new URLSearchParams(window.location.search);
    const classId = params.get("classId");

    const API = "https://edulink-backend-o3hw.onrender.com/api/v1/marks";


    let students = {};
    let category = "mid1";

    let maxMarks = {
      mid1: 15,
      mid2: 15,
      teacherAssessment: 10,
      attendance: 10,
      endsem: 50,
      total: 100,
    };

    /* ===== FETCH DATA FROM DB ===== */

    async function loadStudents() {
      const res = await fetch(`${API}/${classId}`, { credentials: "include" });
      const data = await res.json();

      students = {};

      data.students.forEach((s) => {
        students[s.studentRoll] = {
          mid1: s.marks.mid1 || 0,
          mid2: s.marks.mid2 || 0,
          teacherAssessment: s.marks.teacherAssessment || 0,
          endsem: s.marks.endsem || 0,
          attendanceMarks: getAttendanceMarks(s),
          attendance: s.attendance,
        };
      });

      renderTable();
    }

    /* ===== ATTENDANCE MARKS ===== */

    function getAttendanceMarks(student) {
      let present = student.attendance.present;
      let total = student.attendance.total;

      if (total === 0) return 0;

      let percent = (present / total) * 100;

      if (percent > 90) return 10;
      if (percent > 80) return 9;
      if (percent > 75) return 8;

      return 0;
    }

    /* ===== TOTAL ===== */

    function calculateTotal(student) {
      return (
        student.mid1 +
        student.mid2 +
        student.teacherAssessment +
        student.endsem +
        student.attendanceMarks
      );
    }

    /* ===== CATEGORY SWITCH ===== */

    function loadCategory(cat, btn) {
      category = cat;

      document
        .querySelectorAll(".menu-btn")
        .forEach((b) => b.classList.remove("active"));

      btn.classList.add("active");

      renderTable();
    }

    /* ===== RENDER TABLE ===== */

    function renderTable() {
      let tbody = document.querySelector("#marksTable tbody");

      tbody.innerHTML = "";

      Object.entries(students).forEach(([roll, student]) => {
        let marks;

        if (category === "attendance") {
          marks = getAttendanceMarks({ attendance: student.attendance });
        } else if (category === "total") {
          marks = calculateTotal(student);
        } else {
          marks = student[category];
        }

        let total = marks;

        let percentage = ((marks / maxMarks[category]) * 100).toFixed(2);

        let row = document.createElement("tr");

        row.innerHTML = `
<td>${roll}</td>
<td>${maxMarks[category]}</td>
<td class="marks">${marks}</td>
<td>${total}</td>
<td>${percentage}%</td>
<td>
${category === "attendance" || category === "total"
            ? "-"
            : `<button class="edit-btn"
onclick="editRow(this,'${roll}')">Edit</button>`
          }
</td>
`;

        tbody.appendChild(row);
      });
    }

    /* ===== EDIT MARKS ===== */

    function editRow(btn, roll) {
      let row = btn.parentElement.parentElement;

      let marksCell = row.querySelector(".marks");

      let currentMarks = marksCell.innerText;

      marksCell.innerHTML = `<input type="number" value="${currentMarks}" id="editInput">`;

      btn.style.display = "none";

      let saveBtn = document.createElement("button");

      saveBtn.innerText = "Save";

      saveBtn.className = "save-btn";

      saveBtn.onclick = async function () {
        let newMarks = parseInt(document.getElementById("editInput").value);

        students[roll][category] = newMarks;

        await fetch(`${API}/${classId}`, {
          method: "PUT",

          headers: {
            "Content-Type": "application/json",
          },
          credentials: "include",

          body: JSON.stringify({
            roll,
            category,
            marks: newMarks,
          }),
        });

        renderTable();
      };

      let cancelBtn = document.createElement("button");

      cancelBtn.innerText = "Cancel";

      cancelBtn.className = "cancel-btn";

      cancelBtn.onclick = renderTable;

      btn.parentElement.appendChild(saveBtn);

      btn.parentElement.appendChild(cancelBtn);
    }

    /* ===== SEARCH ===== */

    function searchStudent() {
      let filter = document.getElementById("searchInput").value.toLowerCase();

      document.querySelectorAll("#marksTable tbody tr").forEach((row) => {
        row.style.display = row.cells[0].innerText
          .toLowerCase()
          .includes(filter)
          ? ""
          : "none";
      });
    }

    /* ===== SORT ===== */

    function sortByMarks() {
      let sorted = Object.entries(students).sort((a, b) => {
        let A = category === "total" ? calculateTotal(a[1]) : a[1][category];

        let B = category === "total" ? calculateTotal(b[1]) : b[1][category];

        return B - A;
      });

      students = Object.fromEntries(sorted);

      renderTable();
    }

    /* ===== INIT ===== */

    loadStudents();
  </script>
</body>

</html>
