<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edu Link - Marks Report</title>

  <style>
    :root {
      --primary: #6366f1;
      --bg-light: #0f172a;
      --text-color: #f8fafc;
      --border-color: rgba(255, 255, 255, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      background: var(--bg-light);
      color: var(--text-color);
    }

    header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid var(--border-color);
    }

    .container {
      display: flex;
      min-height: calc(100vh - 90px);
    }

    .sidebar {
      width: 220px;
      padding: 20px;
      border-right: 1px solid var(--border-color);
    }

    .sidebar button {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      cursor: pointer;
    }

    .sidebar button.active,
    .sidebar button:hover {
      background: var(--primary);
      color: white;
    }

    .main {
      flex: 1;
      padding: 20px;
    }

    .top-controls {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    input {
      padding: 7px 10px;
      background: rgba(255, 255, 255, 0.05);
      color: white;
      border: 1px solid var(--border-color);
    }

    .sort-btn {
      padding: 7px 10px;
      background: var(--primary);
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      border: 1px solid var(--border-color);
      padding: 6px;
      text-align: center;
    }

    th {
      background: rgba(99, 102, 241, 0.2);
    }

    .edit-btn,
    .save-btn,
    .cancel-btn {
      padding: 5px 10px;
      border: none;
      cursor: pointer;
      border-radius: 5px;
      margin: 0 2px;
    }

    .edit-btn {
      background: var(--primary);
      color: white;
    }

    .save-btn {
      background: #10B981;
      color: white;
    }

    .cancel-btn {
      background: #EF4444;
      color: white;
    }
  </style>
</head>

<body>

  <header>
    <h1>Marks Report – NIT Kurukshetra</h1>
    <p>Edu Link Student Marks Portal</p>
  </header>

  <div class="container">

    <div class="sidebar">
      <button class="menu-btn active" onclick="loadCategory('mid1', this)">Mid 1</button>
      <button class="menu-btn" onclick="loadCategory('mid2', this)">Mid 2</button>
      <button class="menu-btn" onclick="loadCategory('teacherAssessment', this)">Teacher Assessment</button>
      <button class="menu-btn" onclick="loadCategory('attendance', this)">Attendance</button>
      <button class="menu-btn" onclick="loadCategory('endsem', this)">End Sem</button>
      <button class="menu-btn" onclick="loadCategory('total', this)">Total</button>
    </div>

    <div class="main">

      <div class="top-controls">
        <input type="text" id="searchInput" placeholder="Search Student..." onkeyup="searchStudent()">
        <button class="sort-btn" onclick="sortByMarks()">Sort by Marks</button>
      </div>

      <table id="marksTable">
        <thead>
          <tr>
            <th>Roll No</th>
            <th>Max</th>
            <th>Marks</th>
            <th>Total</th>
            <th>%</th>
            <th>Edit</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

    </div>
  </div>

  <script>

    const params = new URLSearchParams(window.location.search);
    const classId = params.get("classId");

    const API = "https://edulink-backend-o3hw.onrender.com/api/v1/marks";

    let students = {};
    let category = "mid1";

    let maxMarks = {
      mid1: 15,
      mid2: 15,
      teacherAssessment: 10,
      attendance: 10,
      endsem: 50,
      total: 100,
    };

    async function loadStudents() {
      try {
        const res = await fetch(`${API}/${classId}`, { credentials: "include" });
        const data = await res.json();

        students = {};

        data.students.forEach(s => {
          students[s.studentRoll] = {
            mid1: s.marks.mid1 || 0,
            mid2: s.marks.mid2 || 0,
            teacherAssessment: s.marks.teacherAssessment || 0,
            endsem: s.marks.endsem || 0,
            attendance: s.attendance,
            attendanceMarks: getAttendanceMarks(s)
          };
        });

        renderTable();

      } catch (err) {
        alert("Error loading students");
      }
    }

    function getAttendanceMarks(s) {
      let p = s.attendance.present;
      let t = s.attendance.total;

      if (t === 0) return 0;

      let percent = (p / t) * 100;

      if (percent > 90) return 10;
      if (percent > 80) return 9;
      if (percent > 75) return 8;
      return 0;
    }

    function calculateTotal(s) {
      return s.mid1 + s.mid2 + s.teacherAssessment + s.endsem + s.attendanceMarks;
    }

    function loadCategory(cat, btn) {
      category = cat;
      document.querySelectorAll(".menu-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderTable();
    }

    function renderTable() {
      let tbody = document.querySelector("#marksTable tbody");
      tbody.innerHTML = "";

      Object.entries(students).forEach(([roll, s]) => {

        let marks =
          category === "attendance" ? getAttendanceMarks({ attendance: s.attendance }) :
            category === "total" ? calculateTotal(s) :
              s[category];

        let percentage = ((marks / maxMarks[category]) * 100).toFixed(2);

        let row = document.createElement("tr");

        row.innerHTML = `
      <td>${roll}</td>
      <td>${maxMarks[category]}</td>
      <td class="marks">${marks}</td>
      <td>${marks}</td>
      <td>${percentage}%</td>
      <td>
        ${category === "attendance" || category === "total" ? "-" :
            `<button class="edit-btn" onclick="editRow(this,'${roll}')">Edit</button>`}
      </td>
    `;

        tbody.appendChild(row);
      });
    }

    function editRow(btn, roll) {
      let row = btn.closest("tr");
      let marksCell = row.querySelector(".marks");
      let current = marksCell.innerText;

      marksCell.innerHTML = `<input type="number" id="editInput" value="${current}">`;
      btn.style.display = "none";

      let saveBtn = document.createElement("button");
      saveBtn.innerText = "Save";
      saveBtn.className = "save-btn";

      saveBtn.onclick = async () => {
        let newMarks = parseInt(document.getElementById("editInput").value);

        try {
          const res = await fetch(`${API}/${classId}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ roll, category, marks: newMarks })
          });

          const data = await res.json();

          if (data.success) {
            students[roll][category] = newMarks;
          } else {
            alert("Update failed");
          }

        } catch {
          alert("Server error");
        }

        renderTable();
      };

      let cancelBtn = document.createElement("button");
      cancelBtn.innerText = "Cancel";
      cancelBtn.className = "cancel-btn";
      cancelBtn.onclick = renderTable;

      btn.parentElement.appendChild(saveBtn);
      btn.parentElement.appendChild(cancelBtn);
    }

    function searchStudent() {
      let val = document.getElementById("searchInput").value.toLowerCase();

      document.querySelectorAll("#marksTable tbody tr").forEach(row => {
        row.style.display = row.cells[0].innerText.toLowerCase().includes(val) ? "" : "none";
      });
    }

    function sortByMarks() {
      let sorted = Object.entries(students).sort((a, b) => {
        let A = category === "total" ? calculateTotal(a[1]) : a[1][category];
        let B = category === "total" ? calculateTotal(b[1]) : b[1][category];
        return B - A;
      });

      students = Object.fromEntries(sorted);
      renderTable();
    }

    if (!classId) {
      alert("Class ID missing in URL");
    } else {
      loadStudents();
    }

  </script>

</body>

</html>
