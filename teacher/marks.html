<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edu Link - Marks Report</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      background: radial-gradient(circle at top right, #1e1b4b, #0f172a, #020617);
      background-size: 200% 200%;
      min-height: 100vh;
      color: #f8fafc;
      overflow-x: hidden;
    }

    header {
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      color: #f8fafc;
      padding: 20px;
      text-align: center;
      position: relative;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      z-index: 10;
    }

    header h1 {
      font-size: 26px;
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      font-size: 14px;
      color: #94a3b8;
      margin-top: 6px;
      font-weight: 400;
    }

    .logout-btn {
      position: absolute;
      right: 25px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.05);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    
    .logout-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .container {
      display: flex;
      min-height: calc(100vh - 90px);
    }

    .sidebar {
      width: 250px;
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      padding: 30px 20px;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .sidebar button {
      width: 100%;
      padding: 14px 18px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      color: #cbd5e1;
      cursor: pointer;
      font-weight: 500;
      font-size: 14px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      text-align: left;
    }

    .sidebar button:hover {
      background: rgba(255, 255, 255, 0.06);
      transform: translateX(4px);
      color: #f8fafc;
    }

    .sidebar button.active {
      background: linear-gradient(135deg, #6366f1, #3b82f6);
      color: #ffffff;
      border-color: #4f46e5;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
      transform: translateX(4px);
    }

    .main {
      flex: 1;
      padding: 35px;
      overflow-y: auto;
    }

    .top-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
      gap: 15px;
    }

    input[type="text"], input[type="number"] {
      padding: 12px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      width: 280px;
      background: rgba(255, 255, 255, 0.04);
      color: #f8fafc;
      outline: none;
      font-size: 14px;
      transition: all 0.3s;
    }
    
    input[type="text"]:focus, input[type="number"]:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
      background: rgba(255, 255, 255, 0.06);
    }
    
    input[type="text"]::placeholder {
      color: #64748b;
    }

    input[type="number"] {
      width: 100px;
    }

    .sort-btn {
      padding: 12px 24px;
      border: none;
      background: linear-gradient(135deg, #6366f1, #3b82f6);
      color: white;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
    }
    
    .sort-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    th,
    td {
      padding: 18px;
      text-align: center;
      font-size: 15px;
    }

    th {
      background: rgba(255, 255, 255, 0.04);
      color: #f8fafc;
      font-weight: 600;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      text-transform: uppercase;
      font-size: 13px;
      letter-spacing: 0.5px;
    }

    td {
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      color: #e2e8f0;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:nth-child(even) {
      background: rgba(255, 255, 255, 0.015);
    }

    tr:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    .edit-btn,
    .save-btn,
    .cancel-btn {
      padding: 10px 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      margin: 0 4px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .edit-btn {
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }
    
    .edit-btn:hover {
      background: rgba(99, 102, 241, 0.25);
      color: #a5b4fc;
    }

    .save-btn {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    
    .save-btn:hover {
      background: rgba(16, 185, 129, 0.25);
    }

    .cancel-btn {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    
    .cancel-btn:hover {
      background: rgba(239, 68, 68, 0.25);
    }

    .highlight {
      background: rgba(16, 185, 129, 0.15) !important;
      font-weight: 700;
      color: #10b981;
    }
  </style>
</head>

<body>
  <header>
    <h1>Marks Report – NIT Kurukshetra</h1>
    <p>Edu Link Student Marks Portal</p>
    <!-- <button class="logout-btn" onclick="logout()">Logout</button> -->
  </header>

  <div class="container">
    <div class="sidebar">
      <button class="menu-btn active" onclick="loadCategory('mid1', this)">
        Mid 1 Marks
      </button>
      <button class="menu-btn" onclick="loadCategory('mid2', this)">
        Mid 2 Marks
      </button>
      <button class="menu-btn" onclick="loadCategory('teacherAssessment', this)">
        Teacher Assesment Marks
      </button>
      <button class="menu-btn" onclick="loadCategory('attendance', this)">
        Attendance Marks
      </button>
      <button class="menu-btn" onclick="loadCategory('endsem', this)">
        End Semester Marks
      </button>
      <button class="menu-btn" onclick="loadCategory('total', this)">
        Total
      </button>
    </div>

    <div class="main">
      <div class="top-controls">
        <input type="text" id="searchInput" placeholder="Search Student..." onkeyup="searchStudent()" />
        <button class="sort-btn" onclick="sortByMarks()">
          Sort by Marks
        </button>
      </div>

      <table id="marksTable">
        <thead>
          <tr>
            <th>Roll No.</th>
            <th>Max Marks</th>
            <th>Marks Obtained</th>
            <th>Total</th>
            <th>Percentage</th>
            <th>Edit</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script>
    // Immediate Auth Check
    (async function checkAuth() {
      try {
        const res = await fetch("https://edulink-backend-o3hw.onrender.com/api/v1/currentUser", {
          method: "POST",
          credentials: "include",
        });
        if (!res.ok) {
          window.top.location.href = "../login.html";
        }
      } catch (error) {
        window.top.location.href = "../login.html";
      }
    })();

    // Intercept all fetch calls to handle 401 Unauthorized globally
    const originalFetch = window.fetch;
    window.fetch = async (...args) => {
      const response = await originalFetch(...args);
      if (response.status === 401) {
        window.top.location.href = "../login.html";
      }
      return response;
    };

    const params = new URLSearchParams(window.location.search);
    const classId = params.get("classId");

    const API = "https://edulink-backend-o3hw.onrender.com/api/v1/marks";


    let students = {};
    let category = "mid1";

    let maxMarks = {
      mid1: 15,
      mid2: 15,
      teacherAssessment: 10,
      attendance: 10,
      endsem: 50,
      total: 100,
    };

    /* ===== FETCH DATA FROM DB ===== */

    async function loadStudents() {
      const res = await fetch(`${API}/${classId}`, { credentials: "include" });
      const data = await res.json();

      students = {};

      data.students.forEach((s) => {
        students[s.studentRoll] = {
          mid1: s.marks.mid1 || 0,
          mid2: s.marks.mid2 || 0,
          teacherAssessment: s.marks.teacherAssessment || 0,
          endsem: s.marks.endsem || 0,
          attendanceMarks: getAttendanceMarks(s),
          attendance: s.attendance,
        };
      });

      renderTable();
    }

    /* ===== ATTENDANCE MARKS ===== */

    function getAttendanceMarks(student) {
      let present = student.attendance.present;
      let total = student.attendance.total;

      if (total === 0) return 0;

      let percent = (present / total) * 100;

      if (percent > 90) return 10;
      if (percent > 80) return 9;
      if (percent > 75) return 8;

      return 0;
    }

    /* ===== TOTAL ===== */

    function calculateTotal(student) {
      return (
        student.mid1 +
        student.mid2 +
        student.teacherAssessment +
        student.endsem +
        student.attendanceMarks
      );
    }

    /* ===== CATEGORY SWITCH ===== */

    function loadCategory(cat, btn) {
      category = cat;

      document
        .querySelectorAll(".menu-btn")
        .forEach((b) => b.classList.remove("active"));

      btn.classList.add("active");

      renderTable();
    }

    /* ===== RENDER TABLE ===== */

    function renderTable() {
      let tbody = document.querySelector("#marksTable tbody");

      tbody.innerHTML = "";

      Object.entries(students).forEach(([roll, student]) => {
        let marks;

        if (category === "attendance") {
          marks = getAttendanceMarks({ attendance: student.attendance });
        } else if (category === "total") {
          marks = calculateTotal(student);
        } else {
          marks = student[category];
        }

        let total = marks;

        let percentage = ((marks / maxMarks[category]) * 100).toFixed(2);

        let row = document.createElement("tr");

        row.innerHTML = `
<td>${roll}</td>
<td>${maxMarks[category]}</td>
<td class="marks">${marks}</td>
<td>${total}</td>
<td>${percentage}%</td>
<td>
${category === "attendance" || category === "total"
            ? "-"
            : `<button class="edit-btn"
onclick="editRow(this,'${roll}')">Edit</button>`
          }
</td>
`;

        tbody.appendChild(row);
      });
    }

    /* ===== EDIT MARKS ===== */

    function editRow(btn, roll) {
      let row = btn.parentElement.parentElement;

      let marksCell = row.querySelector(".marks");

      let currentMarks = marksCell.innerText;

      marksCell.innerHTML = `<input type="number" value="${currentMarks}" id="editInput">`;

      btn.style.display = "none";

      let saveBtn = document.createElement("button");

      saveBtn.innerText = "Save";

      saveBtn.className = "save-btn";

      saveBtn.onclick = async function () {
        let newMarks = parseInt(document.getElementById("editInput").value);

        students[roll][category] = newMarks;

        await fetch(`${API}/${classId}`, {
          method: "PUT",

          headers: {
            "Content-Type": "application/json",
          },
          credentials: "include",

          body: JSON.stringify({
            roll,
            category,
            marks: newMarks,
          }),
        });

        renderTable();
      };

      let cancelBtn = document.createElement("button");

      cancelBtn.innerText = "Cancel";

      cancelBtn.className = "cancel-btn";

      cancelBtn.onclick = renderTable;

      btn.parentElement.appendChild(saveBtn);

      btn.parentElement.appendChild(cancelBtn);
    }

    /* ===== SEARCH ===== */

    function searchStudent() {
      let filter = document.getElementById("searchInput").value.toLowerCase();

      document.querySelectorAll("#marksTable tbody tr").forEach((row) => {
        row.style.display = row.cells[0].innerText
          .toLowerCase()
          .includes(filter)
          ? ""
          : "none";
      });
    }

    /* ===== SORT ===== */

    function sortByMarks() {
      let sorted = Object.entries(students).sort((a, b) => {
        let A = category === "total" ? calculateTotal(a[1]) : a[1][category];

        let B = category === "total" ? calculateTotal(b[1]) : b[1][category];

        return B - A;
      });

      students = Object.fromEntries(sorted);

      renderTable();
    }

    /* ===== INIT ===== */

    loadStudents();
  </script>
</body>

</html>
