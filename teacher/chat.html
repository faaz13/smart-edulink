<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduLink Chat</title>

    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --bg: transparent;
            --white: #ffffff;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: var(--bg);
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--text);
            overflow: hidden;
        }

        .header {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            color: #fff;
            padding: 20px 25px;
            font-size: 1.2rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            z-index: 10;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-info {
            font-size: 0.9rem;
            color: var(--muted);
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: rgba(0, 0, 0, 0.1);
        }

        /* Message Row */
        .msg-row {
            display: flex;
            width: 100%;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-left {
            justify-content: flex-start;
        }

        .msg-right {
            justify-content: flex-end;
        }

        .msg-bubble {
            max-width: 75%;
            padding: 14px 18px;
            border-radius: 18px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            font-size: 0.95rem;
            line-height: 1.5;
            position: relative;
        }

        /* Other users */
        .msg-left .msg-bubble {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom-left-radius: 4px;
        }

        /* Logged user */
        .msg-right .msg-bubble {
            background: linear-gradient(135deg, #6366f1, #3b82f6);
            color: #fff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.3);
            border: 1px solid rgba(99, 102, 241, 0.4);
        }

        .msg-meta {
            font-size: 0.75rem;
            margin-bottom: 6px;
            color: rgba(255, 255, 255, 0.6);
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }

        .msg-right .msg-meta {
            color: rgba(255, 255, 255, 0.8);
        }

        /* Input */
        .chat-input {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            padding: 20px 25px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 15px;
            border-radius: 0 0 24px 24px;
        }

        .chat-input input {
            flex: 1;
            padding: 14px 20px;
            border-radius: 24px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s;
        }

        .chat-input input::placeholder {
            color: var(--muted);
        }

        .chat-input input:focus {
            background: rgba(0, 0, 0, 0.3);
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        .chat-input button {
            background: linear-gradient(135deg, #6366f1, #3b82f6);
            color: #fff;
            border: none;
            padding: 0 24px;
            border-radius: 24px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-input button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.5);
        }

        .chat-input button:active {
            transform: translateY(1px);
        }

        .error-box {
            text-align: center;
            padding: 20px;
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 12px;
            font-weight: 500;
            margin: 20px;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15); 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.25); 
        }

    </style>
</head>

<body>

    <div class="header">
        <div class="header-title">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            Class Discussion
        </div>
        <div id="userInfo" class="user-info">Connecting...</div>
    </div>

    <div id="chatContainer" class="chat-container"></div>

    <div class="chat-input">
        <input id="msgInput" type="text" placeholder="Type your message here...">
        <button onclick="sendMessage()">
            Send
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
    </div>

    <script>
        // Immediate Auth Check
        (async function checkAuth() {
            try {
                const res = await fetch("https://edulink-backend-o3hw.onrender.com/api/v1/currentUser", {
                    method: "POST",
                    credentials: "include",
                });
                if (!res.ok) {
                    window.top.location.href = "../LOGIN.html";
                }
            } catch (error) {
                window.top.location.href = "../LOGIN.html";
            }
        })();

        // Intercept all fetch calls to handle 401 Unauthorized globally
        const originalFetch = window.fetch;
        window.fetch = async (...args) => {
            const response = await originalFetch(...args);
            if (response.status === 401) {
                window.top.location.href = "../LOGIN.html"; 
            }
            return response;
        };

        const params = new URLSearchParams(window.location.search);
        const classId = params.get("classId");

        const API_BASE = "https://edulink-backend-o3hw.onrender.com/api/v1";

        let loginUser = null;
        let messages = [];

        /* LOAD USER */
        async function loadCurrentUser() {
            const res = await fetch(`${API_BASE}/currentUser`, {
                method: "POST",
                credentials: "include"
            });

            const data = await res.json();

            if (!data.success) {
                window.top.location.href = "../LOGIN.html";
                return;
            }

            loginUser = {
                id: data.user._id,
                name: data.user.fullname || data.user.username
            };

            document.getElementById("userInfo").innerText = loginUser.name;

            fetchMessages();
        }

        /* FETCH ALL MESSAGES */
        async function fetchMessages() {
            try {
                const res = await fetch(`${API_BASE}/chat/messages/${classId}`, {
                    credentials: "include"
                });

                const data = await res.json();

                if (data.success) {
                    messages = data.messages;
                    renderMessages();
                }
            } catch(e) {
                console.error("Error fetching messages", e);
            }
        }

        /* SEND MESSAGE */
        async function sendMessage() {
            const input = document.getElementById("msgInput");
            const text = input.value.trim();
            const btn = document.querySelector(".chat-input button");

            if (!text) return;

            input.value = "";
            btn.disabled = true;

            try {
                await fetch(`${API_BASE}/chat/sendMessage`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "include",
                    body: JSON.stringify({ text, classId })
                });
                fetchMessages();
            } catch(e) {
                console.error("Failed to send", e);
            } finally {
                btn.disabled = false;
                input.focus();
            }
        }

        document.getElementById('msgInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        /* RENDER CHAT */
        function renderMessages() {
            const container = document.getElementById("chatContainer");
            container.innerHTML = "";
            
            if(messages.length === 0) {
                const emptyState = document.createElement("div");
                emptyState.style.textAlign = "center";
                emptyState.style.marginTop = "auto";
                emptyState.style.marginBottom = "auto";
                emptyState.style.color = "var(--muted)";
                emptyState.innerHTML = `
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-bottom: 15px; opacity: 0.5;"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    <p>No messages yet. Start the conversation!</p>`;
                container.appendChild(emptyState);
                return;
            }

            messages.forEach(msg => {
                const isMe = msg.senderId === loginUser.id;

                const row = document.createElement("div");
                row.className = "msg-row " + (isMe ? "msg-right" : "msg-left");

                const bubble = document.createElement("div");
                bubble.className = "msg-bubble";

                const meta = document.createElement("div");
                meta.className = "msg-meta";
                
                const nameSpan = document.createElement("span");
                nameSpan.innerText = isMe ? "You" : (msg.name || "User");
                nameSpan.style.fontWeight = "600";
                
                const timeSpan = document.createElement("span");
                timeSpan.innerText = formatDateTime(msg.createdAt);
                
                meta.appendChild(nameSpan);
                meta.appendChild(timeSpan);

                const textDiv = document.createElement("div");
                textDiv.innerText = msg.text;

                bubble.appendChild(meta);
                bubble.appendChild(textDiv);
                row.appendChild(bubble);
                container.appendChild(row);
            });

            container.scrollTop = container.scrollHeight;
        }

        function formatDateTime(date) {
            return new Date(date).toLocaleString([], {
                hour: "2-digit",
                minute: "2-digit",
                month: "short",
                day: "numeric"
            });
        }

        loadCurrentUser();
        // Poll for new messages every 5 seconds
        setInterval(fetchMessages, 5000);
    </script>
</body>

</html>
