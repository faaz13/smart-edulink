<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --secondary: #0ea5e9;
      --bg-dark: #0f172a;
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-dim: #94a3b8;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top right, #1e1b4b, #0f172a, #020617);
      background-size: cover;
      color: var(--text-main);
      padding: 3rem;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    .blob {
      position: absolute;
      filter: blur(80px);
      z-index: 0;
      opacity: 0.2;
      border-radius: 50%;
      pointer-events: none;
    }

    .blob-1 { top: -10%; left: -5%; width: 400px; height: 400px; background: #4f46e5; }
    .blob-2 { bottom: -10%; right: -5%; width: 500px; height: 500px; background: #0ea5e9; }

    .profile-card {
      background: var(--glass-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 30px;
      padding: 3.5rem;
      box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.6);
      width: 100%;
      max-width: 700px;
      border: 1px solid var(--glass-border);
      position: relative;
      z-index: 1;
    }

    .profile-header {
      text-align: center;
      margin-bottom: 3rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--glass-border);
    }

    .profile-avatar {
      width: 120px;
      height: 120px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: 700;
      margin: 0 auto 1.5rem;
      box-shadow: 0 15px 30px -5px rgba(99, 102, 241, 0.5);
    }

    .profile-name {
      font-size: 2rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.5rem;
      letter-spacing: -0.5px;
    }

    .profile-role {
      color: var(--primary);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 2px;
    }

    .info-group {
      margin-bottom: 2rem;
    }

    .info-label {
      font-size: 0.75rem;
      color: var(--text-dim);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.75rem;
    }

    .info-value {
      font-size: 1.1rem;
      color: #fff;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.03);
      padding: 1rem 1.5rem;
      border-radius: 16px;
      border: 1px solid var(--glass-border);
      transition: var(--transition);
    }

    .info-value:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }

    .loading, .error {
      text-align: center;
      padding: 3rem;
      font-size: 1.1rem;
      color: var(--text-dim);
      position: relative;
      z-index: 1;
    }

    .error { color: #ef4444; }

    @media (max-width: 700px) {
      .grid-2 { grid-template-columns: 1fr; gap: 1rem; }
      .profile-card { padding: 2rem; }
    }
    </style>
</head>

<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="profile-card" id="profileCard" style="display: none;">
        <div class="profile-header">
            <div class="profile-avatar" id="avatarInitials"></div>
            <h2 class="profile-name" id="profileName"></h2>
            <div class="profile-role">Teacher</div>
        </div>

        <div class="info-group">
            <div class="info-label">Username</div>
            <div class="info-value" id="username"></div>
        </div>

        <div class="info-group">
            <div class="info-label">Email Address</div>
            <div class="info-value" id="email"></div>
        </div>

        <div class="grid-2">
            <div class="info-group">
                <div class="info-label">Mobile Number</div>
                <div class="info-value" id="mobile"></div>
            </div>
            <div class="info-group">
                <div class="info-label">Department</div>
                <div class="info-value" id="department"></div>
            </div>
        </div>

    </div>

    <div id="loading" class="loading">Fetching profile data...</div>
    <div id="error" class="error" style="display: none;">Failed to fetch profile.</div>

    <script>
        const API_BASE = "https://edulink-backend-o3hw.onrender.com/api/v1";

        async function fetchProfile() {
            try {
                const res = await fetch(`${API_BASE}/teacher/profile`, {
                    credentials: "include"
                });

                if (!res.ok) {
                    throw new Error("Failed to fetch profile");
                }

                const data = await res.json();

                if (data.success) {
                    const user = data.data;

                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('profileCard').style.display = 'block';

                    document.getElementById('profileName').innerText = user.fullname;
                    document.getElementById('username').innerText = user.username;
                    document.getElementById('email').innerText = user.email;
                    document.getElementById('mobile').innerText = user.mobilenumber;
                    document.getElementById('department').innerText = user.department;

                    // Compute initials
                    const words = user.fullname.trim().split(' ');
                    let initials = '';
                    if (words.length > 0) initials += words[0][0];
                    if (words.length > 1) initials += words[1][0];
                    document.getElementById('avatarInitials').innerText = initials.toUpperCase();
                }

            } catch (err) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').innerText = err.message || "Failed to load profile";
            }
        }

        fetchProfile();
    </script>
</body>

</html>
