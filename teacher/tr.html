<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Teacher Dashboard – EduLink</title>

  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --secondary: #0ea5e9;
      --bg-dark: #020617;
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-dim: #94a3b8;
      --sidebar-width: 260px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top right, #1e1b4b, #0f172a, #020617);
      background-size: cover;
      color: var(--text-main);
      display: flex;
      overflow: hidden;
    }

    .blob {
      position: absolute;
      width: 500px;
      height: 500px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      filter: blur(120px);
      opacity: 0.15;
      border-radius: 50%;
      z-index: 0;
      pointer-events: none;
    }

    .blob-1 { top: -200px; right: -200px; }
    .blob-2 { bottom: -200px; left: -200px; }

    .sidebar {
      width: var(--sidebar-width);
      background: var(--glass-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-right: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      padding: 2.5rem 1.5rem;
      z-index: 10;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 3rem;
      text-decoration: none;
    }

    .logo img {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
    }

    .logo h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
    }

    .topbar {
      height: 80px;
      padding: 0 3rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.015);
      backdrop-filter: blur(10px);
    }

    .create-btn {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      border: none;
      padding: 0.75rem 1.75rem;
      border-radius: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
      position: relative;
      overflow: hidden;
    }

    .create-btn::after {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
      transform: rotate(45deg);
      transition: 0.8s;
    }

    .create-btn:hover::after {
      left: 100%;
    }

    .create-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px -5px rgba(99, 102, 241, 0.5);
    }

    .icons {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--text-dim);
      font-size: 0.95rem;
      font-weight: 500;
      transition: var(--transition);
      cursor: pointer;
      padding: 0.85rem 1.25rem;
      border-radius: 14px;
    }

    .nav-item svg {
      opacity: 0.7;
      transition: var(--transition);
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
    }

    .nav-item:hover svg {
      opacity: 1;
      transform: translateX(2px);
    }

    .nav-item.active {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
    }

    .nav-item.active svg {
      opacity: 1;
    }

    .logout-link:hover {
      background: rgba(239, 68, 68, 0.1) !important;
      color: #f87171 !important;
    }

    .content {
      flex: 1;
      padding: 3.5rem;
      overflow-y: auto;
      scrollbar-width: none;
    }

    .content::-webkit-scrollbar { display: none; }

    .page-title {
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: -1px;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: var(--text-dim);
      font-size: 1.1rem;
      margin-bottom: 3rem;
    }

    #classList {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 2rem;
    }

    .class-box {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 2rem;
      cursor: pointer;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(12px);
    }

    .class-box::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(to right, var(--primary), var(--secondary));
      opacity: 0;
      transition: var(--transition);
    }

    .class-box:hover {
      transform: translateY(-10px);
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(99, 102, 241, 0.3);
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.4);
    }

    .class-box:hover::before { opacity: 1; }

    .class-name {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: #fff;
    }

    .class-code {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-dim);
      font-size: 0.95rem;
      font-weight: 500;
    }
  </style>
</head>

<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <!-- SIDEBAR -->

  <div class="sidebar">
    <div class="logo">
      <img src="https://raw.githubusercontent.com/faaz13/LOGO/main/LOGO.jpeg" />
      <h2>EduLink</h2>
    </div>
    
    <nav style="display: flex; flex-direction: column; gap: 0.75rem; flex: 1;">
      <div class="nav-item active">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Dashboard
      </div>
      <div class="nav-item" onclick="window.location.href='help.html'">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        Support Help
      </div>
      <div class="nav-item" onclick="openProfile()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        My Profile
      </div>
    </nav>

    <div style="border-top: 1px solid var(--glass-border); padding-top: 1.5rem;">
      <div class="nav-item logout-link" onclick="logout()" style="color: #ef4444;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign Out
      </div>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <div style="display: flex; align-items: center; gap: 2rem;">
        <button class="create-btn" onclick="openCreate()" style="display: flex; align-items: center; gap: 10px;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          Create New Class
        </button>
      </div>

      <div class="icons">
        <span id="teacherName" style="font-weight: 600; font-size: 0.95rem; opacity: 0.9;">Teacher</span>
      </div>
    </div>

    <div class="content">
      <div class="page-title">Teacher Dashboard</div>
      <div class="subtitle" id="welcomeMsg">Welcome back! Manage your active classrooms here.</div>

      <div id="classList"></div>
    </div>
  </div>

  <script>
    (async function checkAuth() {
      try {
        const res = await fetch("https://edulink-backend-o3hw.onrender.com/api/v1/currentUser", {
          method: "POST",
          credentials: "include",
        });
        if (!res.ok) {
          window.location.href = "../login.html";
        }
        const data = await res.json();
        if (data.success) {
          document.getElementById('teacherName').innerText = data.user.fullname;
          document.getElementById('welcomeMsg').innerText = `Welcome back, ${data.user.fullname.split(' ')[0]}! Manage your active classrooms here.`;
        }
      } catch (error) {
        window.location.href = "../login.html";
      }
    })();

    const originalFetch = window.fetch;
    window.fetch = async (...args) => {
      const response = await originalFetch(...args);
      if (response.status === 401) {
        window.location.href = "../login.html";
      }
      return response;
    };

    async function logout() {
      try {
        await fetch("https://edulink-backend-o3hw.onrender.com/api/v1/logout/teacher", {
          method: "POST",
          credentials: "include",
        });
      } catch (error) {
        console.log("Logout failed");
      }
      window.location.href = "../login.html";
    }

    function openProfile() {
      window.location.href = "profile.html";
    }

    function openCreate() {
      window.location.href = "createClass.html";
    }

    async function loadClasses() {
      try {
        const res = await fetch(
          "https://edulink-backend-o3hw.onrender.com/api/v1/teacher/classes",
          {
            method: "GET",
            credentials: "include",
          },
        );

        const data = await res.json();
        let classList = document.getElementById("classList");
        classList.innerHTML = "";

        if (data.classes && data.classes.length > 0) {
          data.classes.forEach((cls) => {
            let div = document.createElement("div");
            div.className = "class-box";
            div.onclick = function () { openClass(cls._id); };
            div.innerHTML = `
              <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem;">
                <span class="active-badge" style="background: rgba(99, 102, 241, 0.1); color: var(--primary); padding: 6px 14px; border-radius: 12px; font-size: 0.75rem; font-weight: 700; border: 1px solid rgba(99, 102, 241, 0.2);">ACTIVE</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="opacity: 0.5;"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
              </div>
              <div class="class-name">${cls.name}</div>
              <div class="class-code">
                 <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 8px; vertical-align: middle; opacity: 0.7;"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                 ${cls.students.length} Students enrolled
              </div>
            `;
            classList.appendChild(div);
          });
        } else {
          classList.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 4rem; color: var(--text-dim);">No classes created yet. Use the button above to get started!</div>`;
        }
      } catch (err) {
        console.log("Error loading classes", err);
      }
    }

    function openClass(classId) {
      window.location.href = "./classroom_main.html?classId=" + classId;
    }

    loadClasses();
  </script>
</body>

</html>
