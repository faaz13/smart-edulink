<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Teacher Dashboard – EduLink</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* GLOBAL */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      background: radial-gradient(circle at top right, #1e1b4b, #0f172a, #020617);
      background-size: 200% 200%;
      animation: gradientShift 15s ease infinite alternate;
      color: #f8fafc;
      overflow: hidden;
      position: relative;
    }

    @keyframes gradientShift {
      0% { background-position: 100% 0%; }
      100% { background-position: 0% 100%; }
    }

    /* Ambient blobs */
    .blob {
      position: absolute;
      filter: blur(100px);
      z-index: 0;
      opacity: 0.3;
      border-radius: 50%;
      pointer-events: none;
    }

    .blob-1 {
      top: 10%; left: -5%;
      width: 400px; height: 400px;
      background: #4f46e5;
    }

    .blob-2 {
      bottom: -10%; right: 5%;
      width: 500px; height: 500px;
      background: #0ea5e9;
    }

    /* SIDEBAR */
    .sidebar {
      width: 260px;
      padding: 30px;
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      z-index: 10;
      display: flex;
      flex-direction: column;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 40px;
    }

    .logo img {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: #ffffff;
      padding: 4px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
    }

    .logo h2 {
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* MAIN */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      z-index: 10;
      position: relative;
    }

    /* TOPBAR */
    .topbar {
      height: 85px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* RECTANGULAR CREATE BUTTON */
    .create-btn {
      padding: 12px 30px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #3b82f6);
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 20px -5px rgba(99, 102, 241, 0.5);
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .create-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px -5px rgba(99, 102, 241, 0.6);
    }
    
    .create-btn:active {
      transform: translateY(1px);
    }

    /* ICONS */
    .icons {
      display: flex;
      gap: 25px;
      font-size: 16px;
      font-weight: 500;
      align-items: center;
    }
    
    .icons span {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.3s;
    }
    
    .icons span:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
    }

    /* CONTENT */
    .content {
      flex: 1;
      padding: 40px;
      overflow-y: auto;
    }

    /* CLASS GRID */
    #classList {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 30px;
      margin-top: 40px;
    }

    /* CLASS CARD */
    .class-box {
      padding: 26px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.04);
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      border: 1px solid rgba(255, 255, 255, 0.08);
      position: relative;
      overflow: hidden;
    }

    .class-box::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 5px;
      background: linear-gradient(90deg, #6366f1, #3b82f6);
    }

    .class-box:hover {
      transform: translateY(-8px);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .class-name {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 15px;
      color: #ffffff;
    }

    .class-code {
      font-size: 14px;
      font-weight: 500;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .class-code::before {
      content: '👥';
    }

    /* PAGE TITLE */
    .page-title {
      font-size: 36px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 16px;
      margin-top: 8px;
    }
  </style>
</head>

<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="logo">
      <img src="https://raw.githubusercontent.com/faaz13/LOGO/main/LOGO.jpeg" />
      <h2>EduLink</h2>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <button class="create-btn" onclick="openCreate()">+ Create Class</button>

      <div class="icons">
        <span>Help ❓</span>
        <span onclick="logout()">Logout 👤</span>
      </div>
    </div>

    <div class="content">
      <div class="page-title">Your Classes</div>
      <div class="subtitle">Select a class to manage students, assignments, and curriculum</div>

      <div id="classList"></div>
    </div>
  </div>

  <script>
    // Immediate Auth Check
    (async function checkAuth() {
      try {
        const res = await fetch("https://edulink-backend-o3hw.onrender.com/api/v1/currentUser", {
          method: "POST",
          credentials: "include",
        });
        if (!res.ok) {
          window.location.href = "../LOGIN.html";
        }
      } catch (error) {
        window.location.href = "../LOGIN.html";
      }
    })();

    // Intercept all fetch calls to handle 401 Unauthorized globally
    const originalFetch = window.fetch;
    window.fetch = async (...args) => {
      const response = await originalFetch(...args);
      if (response.status === 401) {
        window.location.href = "../LOGIN.html";
      }
      return response;
    };

    async function logout() {
      try {
        await fetch("https://edulink-backend-o3hw.onrender.com/api/v1/logout/teacher", {
          method: "POST",
          credentials: "include",
        });
      } catch (error) {
        console.log("Logout failed");
      }
      window.location.href = "../LOGIN.html";
    }

    function openCreate() {
      window.location.href = "createClass.html";
    }

    /* Load classes from backend */

    async function loadClasses() {
      try {
        const res = await fetch(
          "https://edulink-backend-o3hw.onrender.com/api/v1/teacher/classes",
          {
            method: "GET",
            credentials: "include",
          },
        );

        const data = await res.json();

        let classList = document.getElementById("classList");
        classList.innerHTML = "";

        data.classes.forEach((cls) => {
          let div = document.createElement("div");

          div.className = "class-box";

          div.onclick = function () {
            openClass(cls._id);
          };

          div.innerHTML = `
<div class="class-name">${cls.name}</div>
<div class="class-code">Total Students: ${cls.students.length}</div>
`;

          classList.appendChild(div);
        });
      } catch (err) {
        console.log("Error loading classes", err);
      }
    }

    /* Open classroom */

    function openClass(classId) {
      window.location.href = "./classroom_main.html?classId=" + classId;
    }

    loadClasses();
  </script>
</body>

</html>
