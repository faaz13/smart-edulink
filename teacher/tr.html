<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Teacher Dashboard – EduLink</title>

  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --secondary: #0ea5e9;
      --bg-dark: #020617;
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-dim: #94a3b8;
      --sidebar-width: 260px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top right, #1e1b4b, #0f172a, #020617);
      background-size: cover;
      color: var(--text-main);
      display: flex;
      overflow: hidden;
    }

    .blob {
      position: absolute;
      width: 500px;
      height: 500px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      filter: blur(120px);
      opacity: 0.15;
      border-radius: 50%;
      z-index: 0;
      pointer-events: none;
    }

    .blob-1 { top: -200px; right: -200px; }
    .blob-2 { bottom: -200px; left: -200px; }

    .sidebar {
      width: var(--sidebar-width);
      background: var(--glass-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-right: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      padding: 2.5rem 1.5rem;
      z-index: 10;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 3rem;
      text-decoration: none;
    }

    .logo img {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
    }

    .logo h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
    }

    .topbar {
      height: 80px;
      padding: 0 3rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.015);
      backdrop-filter: blur(10px);
    }

    .create-btn {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      border: none;
      padding: 0.75rem 1.75rem;
      border-radius: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
    }

    .create-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px -5px rgba(99, 102, 241, 0.5);
    }

    .icons {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .icon-link {
      color: var(--text-dim);
      font-size: 0.95rem;
      font-weight: 500;
      transition: var(--transition);
      cursor: pointer;
      padding: 0.5rem 1rem;
      border-radius: 12px;
    }

    .icon-link:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
    }

    .logout-btn {
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }

    .logout-btn:hover {
      background: rgba(239, 68, 68, 0.1);
    }

    .content {
      flex: 1;
      padding: 3.5rem;
      overflow-y: auto;
      scrollbar-width: none;
    }

    .content::-webkit-scrollbar { display: none; }

    .page-title {
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: -1px;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: var(--text-dim);
      font-size: 1.1rem;
      margin-bottom: 3rem;
    }

    #classList {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 2rem;
    }

    .class-box {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 2rem;
      cursor: pointer;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(12px);
    }

    .class-box::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(to right, var(--primary), var(--secondary));
      opacity: 0;
      transition: var(--transition);
    }

    .class-box:hover {
      transform: translateY(-10px);
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(99, 102, 241, 0.3);
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.4);
    }

    .class-box:hover::before { opacity: 1; }

    .class-name {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: #fff;
    }

    .class-code {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-dim);
      font-size: 0.95rem;
      font-weight: 500;
    }
  </style>
</head>

<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <!-- SIDEBAR -->

  <div class="sidebar">
    <div class="logo">
      <img src="https://raw.githubusercontent.com/faaz13/LOGO/main/LOGO.jpeg" />
      <h2>EduLink</h2>
    </div>
  </div>

  <!-- MAIN -->

  <div class="main">
    <div class="topbar">
      <button class="create-btn" onclick="openCreate()">Create Class</button>

      <div class="icons">
        <div class="icon-link" onclick="openProfile()">👤 Profile</div>
        <div class="icon-link logout-btn" onclick="logout()">🚪 Logout</div>
      </div>
    </div>

    <div class="content">
      <div class="page-title">Your Classes</div>
      <div class="subtitle">Click a class to open the classroom</div>

      <div id="classList"></div>
    </div>
  </div>

  <script>
    // Immediate Auth Check
    (async function checkAuth() {
      try {
        const res = await fetch("https://edulink-backend-o3hw.onrender.com/api/v1/currentUser", {
          method: "POST",
          credentials: "include",
        });
        if (!res.ok) {
          window.location.href = "../login.html";
        }
      } catch (error) {
        window.location.href = "../login.html";
      }
    })();

    // Intercept all fetch calls to handle 401 Unauthorized globally
    const originalFetch = window.fetch;
    window.fetch = async (...args) => {
      const response = await originalFetch(...args);
      if (response.status === 401) {
        window.location.href = "../login.html";
      }
      return response;
    };

    async function logout() {
      try {
        await fetch("https://edulink-backend-o3hw.onrender.com/api/v1/logout/teacher", {
          method: "POST",
          credentials: "include",
        });
      } catch (error) {
        console.log("Logout failed");
      }
      window.location.href = "../login.html";
    }

    function openProfile() {
      // The teacher profile will be displayed in the current window.
      // Or we can just redirect to it.
      window.location.href = "profile.html";
    }

    function openCreate() {
      window.location.href = "createClass.html";
    }

    /* Load classes from backend */

    async function loadClasses() {
      try {
        const res = await fetch(
          "https://edulink-backend-o3hw.onrender.com/api/v1/teacher/classes",
          {
            method: "GET",
            credentials: "include",
          },
        );

        const data = await res.json();

        let classList = document.getElementById("classList");
        classList.innerHTML = "";

        data.classes.forEach((cls) => {
          let div = document.createElement("div");

          div.className = "class-box";

          div.onclick = function () {
            openClass(cls._id);
          };

          div.innerHTML = `
<div class="class-name">${cls.name}</div>
<div class="class-code">Total Students ${cls.students.length}</div>
`;

          classList.appendChild(div);
        });
      } catch (err) {
        console.log("Error loading classes", err);
      }
    }

    /* Open classroom */

    function openClass(classId) {
      window.location.href = "./classroom_main.html?classId=" + classId;
    }

    loadClasses();
  </script>
</body>

</html>
