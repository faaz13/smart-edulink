<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Classroom - EduLink</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Inter", sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top right, #1e1b4b, #0f172a, #020617);
      background-size: 200% 200%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #f8fafc;
    }

    .container {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      width: 100%;
      max-width: 480px;
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      padding: 32px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 600;
      color: #f8fafc;
    }

    .header p {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 4px;
    }

    .section-title {
      font-size: 15px;
      font-weight: 600;
      margin: 20px 0 10px;
      color: #e2e8f0;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 14px;
    }

    label {
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 4px;
      font-weight: 500;
    }

    input,
    select {
      background: rgba(255, 255, 255, 0.05);
      color: #f8fafc;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 14px;
      outline: none;
      transition: all 0.3s;
    }

    input:focus,
    select:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
    }
    
    input[type="time"]::-webkit-calendar-picker-indicator,
    input[type="month"]::-webkit-calendar-picker-indicator {
        filter: invert(1);
    }
    
    option {
        background: #0f172a;
        color: #f8fafc;
    }

    #classCode {
      background: rgba(255, 255, 255, 0.02);
      color: #94a3b8;
    }

    .day-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      margin-top: 18px;
      border: none;
      border-radius: 12px;
      background: #6366f1;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .btn:hover {
        background: #4f46e5;
        transform: translateY(-2px);
    }

    /* message box */

    #messageBox {
      margin-top: 10px;
      padding: 10px;
      border-radius: 10px;
      font-size: 13px;
      display: none;
      text-align: center;
      font-weight: 500;
    }

    .success {
      background: rgba(16, 185, 129, 0.2);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .error {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>Create New Classroom</h1>
      <p>Set up your class details and timetable</p>
    </div>

    <form id="classForm">
      <div class="input-group">
        <label>Class Name</label>
        <input type="text" id="className" placeholder="Enter class name" />
      </div>

      <div class="input-group">
        <label>Class Code</label>
        <input type="text" id="classCode" readonly />
      </div>

      <div class="input-group">
        <label>Class Year</label>
        <input type="text" id="classyear" placeholder="Enter batch year" />
      </div>

      <div class="section-title">Duration</div>

      <div class="input-group">
        <label>From Month & Year</label>
        <input type="month" id="fromMonth" />
      </div>

      <div class="input-group">
        <label>To Month & Year</label>
        <input type="month" id="toMonth" />
      </div>

      <div class="section-title">Weekly Timetable</div>

      <div class="input-group">
        <label>Day 1</label>
        <div class="day-row">
          <select id="day1">
            <option value="">Select Day</option>
            <option>Monday</option>
            <option>Tuesday</option>
            <option>Wednesday</option>
            <option>Thursday</option>
            <option>Friday</option>
            <option>Saturday</option>
          </select>
          <input type="time" id="time1" />
        </div>
      </div>

      <div class="input-group">
        <label>Day 2</label>
        <div class="day-row">
          <select id="day2">
            <option value="">Select Day</option>
            <option>Monday</option>
            <option>Tuesday</option>
            <option>Wednesday</option>
            <option>Thursday</option>
            <option>Friday</option>
            <option>Saturday</option>
          </select>
          <input type="time" id="time2" />
        </div>
      </div>

      <div class="input-group">
        <label>Day 3</label>
        <div class="day-row">
          <select id="day3">
            <option value="">Select Day</option>
            <option>Monday</option>
            <option>Tuesday</option>
            <option>Wednesday</option>
            <option>Thursday</option>
            <option>Friday</option>
            <option>Saturday</option>
          </select>
          <input type="time" id="time3" />
        </div>
      </div>

      <div id="messageBox"></div>

      <button type="submit" class="btn">Create Class</button>
    </form>
  </div>

  <script>
    // Immediate Auth Check
    (async function checkAuth() {
      try {
        const res = await fetch("https://edulink-backend-o3hw.onrender.com/api/v1/currentUser", {
          method: "POST",
          credentials: "include",
        });
        if (!res.ok) {
          window.location.href = "../login.html";
        }
      } catch (error) {
        window.location.href = "../login.html";
      }
    })();

    // Intercept all fetch calls to handle 401 Unauthorized globally
    const originalFetch = window.fetch;
    window.fetch = async (...args) => {
      const response = await originalFetch(...args);
      if (response.status === 401) {
        window.location.href = "../login.html";
      }
      return response;
    };

    /* generate class code */

    function generateCode() {
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

      let code = "EDU-";

      for (let i = 0; i < 6; i++) {
        code += chars.charAt(Math.floor(Math.random() * chars.length));
      }

      return code;
    }

    document.getElementById("classCode").value = generateCode();

    /* show message on UI */

    function showMessage(message, type) {
      const box = document.getElementById("messageBox");

      box.style.display = "block";

      box.className = type;

      box.innerText = message;
    }

    /* submit form */

    document
      .getElementById("classForm")
      .addEventListener("submit", async function (e) {
        e.preventDefault();

        let classroom = {
          name: document.getElementById("className").value,

          code: document.getElementById("classCode").value,

          year: document.getElementById("classyear").value,

          duration: {
            from: document.getElementById("fromMonth").value,
            to: document.getElementById("toMonth").value,
          },

          timetable: [
            {
              day: document.getElementById("day1").value,
              time: document.getElementById("time1").value,
              topic: "-"
            },
            {
              day: document.getElementById("day2").value,
              time: document.getElementById("time2").value,
              topic: "-"
            },
            {
              day: document.getElementById("day3").value,
              time: document.getElementById("time3").value,
              topic: "-"

            },
          ].filter((t) => t.day !== "" && t.time !== ""),
        };

        if (classroom.name === "") {
          showMessage("Please enter class name", "error");

          return;
        }

        try {
          const response = await fetch("https://edulink-backend-o3hw.onrender.com/api/v1/create", {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
            },

            credentials: "include",

            body: JSON.stringify(classroom),
          },
          );

          const data = await response.json();

          if (data.success) {
            showMessage("Class created successfully", "success");

            setTimeout(() => {
              window.location.href = "tr.html";
            }, 1500);
          } else {
            showMessage(data.message || "Failed to create class", "error");
          }
        } catch (err) {
          showMessage("Server error occurred", "error");
        }
      });
  </script>
</body>

</html>
