<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Classroom - EduLink</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top right, #1e1b4b, #0f172a, #020617);
      background-size: 200% 200%;
      animation: gradientShift 15s ease infinite alternate;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      color: #f8fafc;
      position: relative;
    }

    @keyframes gradientShift {
        0% { background-position: 100% 0%; }
        100% { background-position: 0% 100%; }
    }

    /* Ambient blobs */
    .blob {
        position: absolute;
        filter: blur(100px);
        z-index: 0;
        opacity: 0.3;
        border-radius: 50%;
        pointer-events: none;
    }
    .blob-1 { top: -10%; left: -10%; width: 450px; height: 450px; background: #6366f1; }
    .blob-2 { bottom: -10%; right: -10%; width: 550px; height: 550px; background: #3b82f6; }

    .container {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      width: 100%;
      max-width: 520px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.6);
      padding: 40px;
      position: relative;
      z-index: 10;
      animation: fadeIn 0.4s ease-out forwards;
      overflow: hidden;
    }

    .container::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 5px;
      background: linear-gradient(90deg, #6366f1, #3b82f6);
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 0.95rem;
      color: #94a3b8;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin: 30px 0 15px;
      color: #ffffff;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 20px;
    }

    label {
      font-size: 0.9rem;
      color: #cbd5e1;
      margin-bottom: 8px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    input, select {
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(0, 0, 0, 0.2);
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s;
    }

    input:focus, select:focus {
        background: rgba(0, 0, 0, 0.3);
        border-color: #6366f1;
        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
    }

    select option {
        background: #0f172a;
        color: white;
    }

    input[type="month"]::-webkit-calendar-picker-indicator,
    input[type="time"]::-webkit-calendar-picker-indicator {
        filter: invert(1);
        cursor: pointer;
    }

    #classCode {
      background: rgba(99, 102, 241, 0.1);
      color: #818cf8;
      border: 1px dashed rgba(99, 102, 241, 0.4);
      font-family: monospace;
      font-size: 1.2rem;
      letter-spacing: 2px;
      text-align: center;
      font-weight: 600;
    }

    .day-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .btn {
      width: 100%;
      padding: 16px;
      margin-top: 30px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #6366f1, #3b82f6);
      color: white;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(99, 102, 241, 0.5);
    }

    .btn:active {
        transform: translateY(1px);
    }

    .btn:disabled {
        background: rgba(255, 255, 255, 0.1);
        color: #64748b;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
    }

    /* message box */
    #messageBox {
      margin-top: 20px;
      padding: 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      display: none;
      text-align: center;
      font-weight: 500;
    }

    .success {
        background: rgba(16, 185, 129, 0.1);
        color: #6ee7b7;
        border: 1px solid rgba(16, 185, 129, 0.2);
    }

    .error {
        background: rgba(239, 68, 68, 0.1);
        color: #fca5a5;
        border: 1px solid rgba(239, 68, 68, 0.2);
    }

    /* Scrollbar for page */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }

  </style>
</head>

<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="container">
    <div class="header">
      <div style="cursor:pointer; margin-bottom: 20px; display: inline-block; padding: 10px; border-radius: 50%; background: rgba(255,255,255,0.05);" onclick="window.history.back()">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      </div>
      <h1>Create New Classroom</h1>
      <p>Set up your module details and learning timetable.</p>
    </div>

    <form id="classForm">
      <div class="input-group">
        <label>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
            Subject / Class Name
        </label>
        <input type="text" id="className" placeholder="e.g. Advanced Mathematics" />
      </div>

      <div class="input-group">
        <label>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            Registration Access Code
        </label>
        <input type="text" id="classCode" readonly title="Generated automatically. Share this code with your students."/>
      </div>

      <div class="input-group">
        <label>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            Academic Year / Batch
        </label>
        <input type="text" id="classyear" placeholder="e.g. 2024-2025" />
      </div>

      <div class="section-title">Course Duration</div>

      <div class="day-row">
        <div class="input-group">
            <label>Start Month</label>
            <input type="month" id="fromMonth" />
        </div>

        <div class="input-group">
            <label>End Month</label>
            <input type="month" id="toMonth" />
        </div>
      </div>

      <div class="section-title">Initial Weekly Schedule</div>
      <p style="font-size: 0.85rem; color: var(--secondary); margin-top: -10px; margin-bottom: 20px;">You can reschedule these instances from the dashboard later.</p>

      <div class="input-group">
        <label>Primary Session</label>
        <div class="day-row">
          <select id="day1">
            <option value="">Select Day</option>
            <option>Monday</option>
            <option>Tuesday</option>
            <option>Wednesday</option>
            <option>Thursday</option>
            <option>Friday</option>
            <option>Saturday</option>
          </select>
          <input type="time" id="time1" />
        </div>
      </div>

      <div class="input-group">
        <label>Secondary Session (Optional)</label>
        <div class="day-row">
          <select id="day2">
            <option value="">Select Day</option>
            <option>Monday</option>
            <option>Tuesday</option>
            <option>Wednesday</option>
            <option>Thursday</option>
            <option>Friday</option>
            <option>Saturday</option>
          </select>
          <input type="time" id="time2" />
        </div>
      </div>

      <div class="input-group">
        <label>Tertiary Session (Optional)</label>
        <div class="day-row">
          <select id="day3">
            <option value="">Select Day</option>
            <option>Monday</option>
            <option>Tuesday</option>
            <option>Wednesday</option>
            <option>Thursday</option>
            <option>Friday</option>
            <option>Saturday</option>
          </select>
          <input type="time" id="time3" />
        </div>
      </div>

      <div id="messageBox"></div>

      <button type="submit" class="btn">Create Classroom Network</button>
    </form>
  </div>

  <script>
    // Immediate Auth Check
    (async function checkAuth() {
      try {
        const res = await fetch("https://edulink-backend-o3hw.onrender.com/api/v1/currentUser", {
          method: "POST",
          credentials: "include",
        });
        if (!res.ok) {
          window.location.href = "../LOGIN.html";
        }
      } catch (error) {
        window.location.href = "../LOGIN.html";
      }
    })();

    // Intercept all fetch calls to handle 401 Unauthorized globally
    const originalFetch = window.fetch;
    window.fetch = async (...args) => {
      const response = await originalFetch(...args);
      if (response.status === 401) {
        window.location.href = "../LOGIN.html";
      }
      return response;
    };

    /* generate class code */
    function generateCode() {
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
      let code = "EDU-";
      for (let i = 0; i < 6; i++) {
        code += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return code;
    }

    document.getElementById("classCode").value = generateCode();

    /* show message on UI */
    function showMessage(message, type) {
      const box = document.getElementById("messageBox");
      box.style.display = "block";
      box.className = type;
      box.innerText = message;
    }

    /* submit form */
    document.getElementById("classForm").addEventListener("submit", async function (e) {
        e.preventDefault();

        const btn = document.querySelector(".btn");
        btn.disabled = true;
        btn.innerText = "Creating Classroom...";

        let classroom = {
          name: document.getElementById("className").value,
          code: document.getElementById("classCode").value,
          year: document.getElementById("classyear").value,
          duration: {
            from: document.getElementById("fromMonth").value,
            to: document.getElementById("toMonth").value,
          },
          timetable: [
            { day: document.getElementById("day1").value, time: document.getElementById("time1").value, topic: "-" },
            { day: document.getElementById("day2").value, time: document.getElementById("time2").value, topic: "-" },
            { day: document.getElementById("day3").value, time: document.getElementById("time3").value, topic: "-" },
          ].filter((t) => t.day !== "" && t.time !== ""),
        };

        if (classroom.name === "") {
          showMessage("Please define a Subject / Class Name", "error");
          btn.disabled = false;
          btn.innerText = "Create Classroom Network";
          return;
        }

        try {
          const response = await fetch("https://edulink-backend-o3hw.onrender.com/api/v1/create", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify(classroom),
          });

          const data = await response.json();

          if (data.success || response.ok) {
            showMessage("Success! Setting up your space...", "success");
            setTimeout(() => {
              window.location.href = "tr.html";
            }, 1500);
          } else {
            showMessage(data.message || "Failed to finalize classroom creation", "error");
            btn.disabled = false;
            btn.innerText = "Create Classroom Network";
          }
        } catch (err) {
          showMessage("Network error occurred connecting to server", "error");
          btn.disabled = false;
          btn.innerText = "Create Classroom Network";
        }
      });
  </script>
</body>

</html>
