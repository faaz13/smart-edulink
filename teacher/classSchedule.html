<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduLink – Class Reschedule</title>

  <style>
    :root {
      --primary: #6366f1;
      --bg-light: #0f172a;
      --text-color: #f8fafc;
      --border-color: rgba(255, 255, 255, 0.08);
    }

    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: transparent;
      color: var(--text-color);
    }

    header {
      padding: 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
    }

    header h3 {
      margin: 0;
    }

    .container {
      padding: 20px;
      max-width: 1000px;
      margin: auto;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input[type="text"], input[type="time"], select {
      padding: 7px 10px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      outline: none;
    }
    
    input[type="time"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
    }
    
    option {
      background: var(--bg-light);
      color: var(--text-color);
    }

    .day-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      padding: 15px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    button {
      padding: 7px 10px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      cursor: pointer;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    
    .reset {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 5px;
    }
    
    .day-card button {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 5px;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: var(--bg-light);
      border: 1px solid var(--border-color);
      padding: 20px;
      width: 350px;
    }

    .modal-content h3 {
      margin-top: 0;
      margin-bottom: 15px;
    }

    .modal-content input,
    .modal-content select {
      width: 100%;
      margin-bottom: 10px;
    }

    .modal-content button {
      margin-top: 5px;
      margin-right: 5px;
      border-radius: 5px;
    }
    
    .modal-content button:first-of-type {
      background: var(--primary);
      color: white;
      border: none;
    }
  </style>
</head>

<body>
  <header>
    <!-- <h2>EduLink</h2> -->
    <h3>Class Reschedule</h3>
  </header>

  <div class="container">
    <div class="controls">
      <input type="text" id="search" placeholder="Search day or topic..." />
    </div>

    <div id="scheduleList"></div>
  </div>

  <!-- MODAL -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <h3>Edit Class</h3>

      <select id="daySelect"></select>
      <input type="time" id="timeInput" />
      <input type="text" id="topicInput" placeholder="Topic" />

      <button onclick="saveSchedule()">Save</button>
      <button onclick="closeModal()">Cancel</button>
    </div>
  </div>

  <script>
    // Immediate Auth Check
    (async function checkAuth() {
      try {
        const res = await fetch("https://edulink-backend-o3hw.onrender.com/api/v1/currentUser", {
          method: "POST",
          credentials: "include",
        });
        if (!res.ok) {
          window.top.location.href = "../login.html";
        }
      } catch (error) {
        window.top.location.href = "../login.html";
      }
    })();

    // Intercept all fetch calls to handle 401 Unauthorized globally
    const originalFetch = window.fetch;
    window.fetch = async (...args) => {
      const response = await originalFetch(...args);
      if (response.status === 401) {
        window.top.location.href = "../login.html";
      }
      return response;
    };

    const params = new URLSearchParams(window.location.search);
    const classId = params.get("classId");

    const API = "https://edulink-backend-o3hw.onrender.com/api/v1/schedule";

    const allDays = [
      "Monday",
      "Tuesday",
      "Wednesday",
      "Thursday",
      "Friday",
      "Saturday",
      "Sunday",
    ];

    let currentSchedule = [];

    let editingIndex = null;

    /* ================= FETCH FROM DATABASE ================= */

    async function loadSchedule() {
      const res = await fetch(`${API}/${classId}`, { credentials: "include" });

      const data = await res.json();

      currentSchedule = data.schedule;

      render();
    }

    /* ================= RENDER ================= */

    function render() {
      const list = document.getElementById("scheduleList");

      list.innerHTML = "";

      currentSchedule.forEach((cls, index) => {
        const card = document.createElement("div");

        card.className = "day-card";

        card.innerHTML = `
<div>
<strong>${cls.day}</strong><br>
${cls.time} — ${cls.topic}
</div>

<button onclick="openModal(${index})">
Reschedule
</button>
`;

        list.appendChild(card);
      });
    }

    function openModal(index) {
      editingIndex = index;

      modal.style.display = "flex";

      const cls = currentSchedule[index];

      daySelect.value = cls.day;

      timeInput.value = cls.time;

      topicInput.value = cls.topic;
    }

    function closeModal() {
      modal.style.display = "none";
    }
    async function saveSchedule() {
      const day = daySelect.value;

      const time = timeInput.value;

      const topic = topicInput.value;

      if (!time || !topic) {
        alert("Fill all fields");
        return;
      }

      await fetch(`${API}/${classId}`, {
        method: "PUT",

        headers: {
          "Content-Type": "application/json",
        },
        credentials: "include",

        body: JSON.stringify({
          index: editingIndex,
          day,
          time,
          topic,
        }),
      });

      closeModal();

      loadSchedule();
    }

    document.getElementById("search").addEventListener("input", (e) => {
      const value = e.target.value.toLowerCase();

      document.querySelectorAll(".day-card").forEach((card) => {
        card.style.display = card.innerText.toLowerCase().includes(value)
          ? ""
          : "none";
      });
    });
    allDays.forEach((d) => {
      const opt = document.createElement("option");

      opt.value = d;

      opt.textContent = d;

      daySelect.appendChild(opt);
    });

    loadSchedule();
  </script>
</body>

</html>
