<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Attendance</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #0ea5e9;
            --bg-dark: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            scrollbar-width: thin;
            scrollbar-color: var(--glass-border) transparent;
        }

        *::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        *::-webkit-scrollbar-track {
            background: transparent;
        }

        *::-webkit-scrollbar-thumb {
            background: var(--glass-border);
            border-radius: 10px;
        }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            color: var(--text-main);
            background: transparent;
            overflow-x: hidden;
        }

        .container {
            padding: 24px;
            max-width: 100%;
        }

        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 20px;
            flex-wrap: wrap;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.02);
            padding: 8px 16px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: var(--text-dim);
        }

        select {
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            outline: none;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
        }

        select:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.1);
        }

        option {
            background: #1e1b4b;
            color: white;
        }

        #load {
            padding: 8px 20px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
            font-family: inherit;
        }

        #load:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(99, 102, 241, 0.3);
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            background: rgba(255, 255, 255, 0.01);
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
        }

        table {
            border-collapse: separate;
            border-spacing: 0;
            width: 100%;
        }

        th, td {
            padding: 12px 8px;
            text-align: center;
            border-bottom: 1px solid var(--glass-border);
            border-right: 1px solid var(--glass-border);
            font-size: 0.85rem;
        }

        th:last-child, td:last-child {
            border-right: none;
        }

        tr:last-child td {
            border-bottom: none;
        }

        th {
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-dim);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th.date {
            cursor: pointer;
            transition: var(--transition);
            min-width: 40px;
        }

        th.date:hover {
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary);
        }

        th.holiday {
            background: rgba(239, 68, 68, 0.1) !important;
            color: #f87171 !important;
        }

        td:first-child, th:first-child {
            position: sticky;
            left: 0;
            z-index: 20;
            background: #0f172a; /* Solid color for sticky column to avoid transparency issues */
            min-width: 80px;
            border-right: 2px solid var(--glass-border);
        }
        
        th:first-child {
            z-index: 30;
        }

        .total {
            font-weight: 700;
            color: var(--primary);
            background: rgba(99, 102, 241, 0.05);
        }

        input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid var(--glass-border);
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.02);
            cursor: pointer;
            position: relative;
            transition: var(--transition);
        }

        input[type="checkbox"]:checked {
            background: var(--primary);
            border-color: var(--primary);
        }

        input[type="checkbox"]:checked::after {
            content: "\f00c";
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            color: white;
            font-size: 10px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        input[type="checkbox"]:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        input[type="checkbox"]:hover:not(:disabled) {
            border-color: var(--primary);
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .table-wrapper {
            animation: fadeIn 0.5s ease-out;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header-flex">
            <h2>Student Attendance</h2>
            <div class="controls">
                <div class="control-group">
                    <i class="fas fa-calendar-alt"></i>
                    <span>Month:</span>
                    <select id="month"></select>
                </div>
                <div class="control-group">
                    <i class="fas fa-history"></i>
                    <span>Year:</span>
                    <select id="year"></select>
                </div>
                <button id="load">
                    <i class="fas fa-sync-alt"></i>
                    Load
                </button>
            </div>
        </div>
        <div class="table-wrapper">
            <div id="attendanceTable"></div>
        </div>
    </div>

    <script>
        // Immediate Auth Check
        (async function checkAuth() {
            try {
                const res = await fetch("https://edulink-backend-o3hw.onrender.com/api/v1/currentUser", {
                    method: "POST",
                    credentials: "include",
                });
                if (!res.ok) {
                    window.top.location.href = "../login.html";
                }
            } catch (error) {
                window.top.location.href = "../login.html";
            }
        })();

        // Intercept all fetch calls to handle 401 Unauthorized globally
        const originalFetch = window.fetch;
        window.fetch = async (...args) => {
            const response = await originalFetch(...args);
            if (response.status === 401) {
                window.top.location.href = "../login.html";
            }
            return response;
        };

        const params = new URLSearchParams(window.location.search);
        const classId = params.get("classId");
        const storageKey = "attendanceData_" + classId;
        const API_BASE = "https://edulink-backend-o3hw.onrender.com/api/v1/attendence";

        let attendanceData = JSON.parse(localStorage.getItem(storageKey)) || {};
        let holidays = new Set();
        const students = [];

        const monthSelect = document.getElementById("month");
        const yearSelect = document.getElementById("year");
        const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

        let classDuration = null;

        function updateMonthDropdown(selectedYear) {
            monthSelect.innerHTML = '';
            let startM = 0;
            let endM = 11;

            if (classDuration) {
                const { fromYear, fromMonth, toYear, toMonth } = classDuration;
                if (parseInt(selectedYear) === fromYear) startM = fromMonth;
                if (parseInt(selectedYear) === toYear) endM = toMonth;
            }
            
            for (let m = startM; m <= endM; m++) {
                let o = document.createElement("option");
                o.value = m;
                o.text = months[m];
                monthSelect.appendChild(o);
            }
        }

        function initDropdowns(duration) {
            classDuration = null;
            if (duration && duration.from && duration.to) {
                const [fYear, fMonth] = duration.from.split('-');
                const [tYear, tMonth] = duration.to.split('-');
                classDuration = {
                    fromYear: parseInt(fYear),
                    fromMonth: parseInt(fMonth) - 1,
                    toYear: parseInt(tYear),
                    toMonth: parseInt(tMonth) - 1
                };
            }

            yearSelect.innerHTML = '';
            if (classDuration) {
                for (let y = classDuration.fromYear; y <= classDuration.toYear; y++) {
                    let o = document.createElement("option"); o.value = y; o.text = y;
                    yearSelect.appendChild(o);
                }
            } else {
                let currentYear = new Date().getFullYear();
                for (let y = currentYear - 2; y <= currentYear + 2; y++) {
                    let o = document.createElement("option"); o.value = y; o.text = y;
                    yearSelect.appendChild(o);
                }
            }
            
            updateMonthDropdown(yearSelect.value);
            monthSelect.value = classDuration ? classDuration.fromMonth : new Date().getMonth();
        }

        function getKey() {
            return yearSelect.value + "-" + monthSelect.value;
        }

        function generateTable() {
            let key = getKey();
            let saved = attendanceData[key];
            holidays = new Set(saved?.holidays || []);
            let month = parseInt(monthSelect.value);
            let year = parseInt(yearSelect.value);
            let days = new Date(year, month + 1, 0).getDate();
            let html = "<table><tr><th>Roll No</th>";
            for (let d = 1; d <= days; d++) {
                let isHoliday = holidays.has(d);
                html += `<th class="date ${isHoliday ? 'holiday' : ''}" onclick="toggleHoliday(${d})">${isHoliday ? 'Holiday' : d}</th>`;
            }
            html += "<th>Total</th></tr>";
            students.forEach((roll, row) => {
                html += `<tr><td>${roll}</td>`;
                for (let d = 1; d <= days; d++) {
                    let checked = saved?.students?.[roll]?.days?.includes(d);
                    let disabled = holidays.has(d);
                    html += `<td><input type="checkbox" class="r${row}" ${checked ? 'checked' : ''} ${disabled ? 'disabled' : ''} onchange="updateTotal(${row})"></td>`;
                }
                let total = saved?.students?.[roll]?.total || 0;
                html += `<td class="total" id="t${row}">${total}</td></tr>`;
            });
            html += "</table>";
            document.getElementById("attendanceTable").innerHTML = html;
        }

        function toggleHoliday(day) {
            if (holidays.has(day)) holidays.delete(day);
            else holidays.add(day);
            saveAttendance();
            render();
        }

        function updateTotal(row) {
            let total = 0;
            document.querySelectorAll(".r" + row).forEach(c => {
                if (c.checked && !c.disabled) total++;
            });
            document.getElementById("t" + row).innerText = total;
            saveAttendance();
        }

        function saveAttendance() {
            let key = getKey();
            attendanceData[key] = { holidays: [...holidays], students: {} };
            students.forEach((roll, row) => {
                let total = 0;
                let days = [];
                document.querySelectorAll(".r" + row).forEach((c, i) => {
                    if (c.checked && !c.disabled) {
                        total++;
                        days.push(i + 1);
                    }
                });
                attendanceData[key].students[roll] = { total: total, days: days };
            });
            localStorage.setItem(storageKey, JSON.stringify(attendanceData));
            sendCombinedAttendance();
        }

        function getCombinedAttendance() {
            let result = {};

            for (let monthKey in attendanceData) {
                let monthObj = attendanceData[monthKey];

                // 🔹 Step 1: Find max day from ANY student
                let maxDay = 0;

                for (let roll in monthObj.students) {
                    let days = monthObj.students[roll].days || [];
                    if (days.length > 0) {
                        let studentMax = Math.max(...days);
                        if (studentMax > maxDay) {
                            maxDay = studentMax;
                        }
                    }
                }
                if (maxDay === 0) continue;

                // 🔹 Step 2: Count holidays till maxDay
                let holidaysTillMax = (monthObj.holidays || [])
                    .filter(d => d <= maxDay).length;

                let totalClasses = maxDay - holidaysTillMax;

                // 🔹 Step 3: For each student
                students.forEach(roll => {
                    if (!result[roll]) {
                        result[roll] = { daysPresent: 0, total_days: 0 };
                    }

                    let studentData = monthObj.students[roll];

                    // attended = size of days array
                    let attended = studentData?.days?.length || 0;

                    result[roll].daysPresent += attended;
                    result[roll].total_days += totalClasses;
                });
            }

            return result;
        }

        async function sendCombinedAttendance() {
            let combinedAttendance = getCombinedAttendance();
            await fetch(`${API_BASE}/update-attendance`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                credentials: "include",
                body: JSON.stringify({ classId: classId, combinedAttendance: combinedAttendance })
            });
        }

        async function init() {
            try {
                const res = await fetch(`${API_BASE}/init/${classId}`, { credentials: "include" });
                const data = await res.json();
                if (data.success) {
                    if (data.students) {
                        students.length = 0; // Clear existing
                        data.students.forEach(s => students.push(s.studentRoll));
                    }
                    initDropdowns(data.duration);
                }
            } catch (error) {
                console.error("Init failed", error);
            }
            render();
        }

        function render() { generateTable(); }

        document.getElementById("load").onclick = render;
        monthSelect.onchange = render;
        yearSelect.onchange = () => {
             updateMonthDropdown(yearSelect.value);
             render();
        };
        init();
    </script>
</body>

</html>
