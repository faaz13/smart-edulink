<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduLink | Classroom</title>

  <style>
    :root {
      --primary: #6366f1;
      --bg-light: #0f172a;
      --card-bg: rgba(255, 255, 255, 0.03);
      --border-color: rgba(255, 255, 255, 0.08);
      --text-color: #f8fafc;
    }

    * {
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
    }

    /* LOCK PAGE HEIGHT (removes outer scrollbar) */
    body {
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at top right, #1e1b4b, #0f172a, #020617);
      background-size: 200% 200%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-color);
    }

    /* MAIN CARD */
    #main {
      width: 90%;
      max-width: 1200px;
      height: 92vh;
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-color);
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
      border-radius: 16px;
      padding: 25px;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    #heading {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      margin-bottom: 20px;
    }

    #brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #brand img {
      height: 40px;
      border-radius: 10px;
    }

    #brand span {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-color);
    }

    #heading h2 {
      text-align: center;
      color: var(--text-color);
    }

    #log_out a {
      text-decoration: none;
      color: #fca5a5;
      font-weight: 600;
      font-size: 14px;
    }

    /* DASHBOARD LAYOUT */
    #dashboard {
      flex: 1;
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 20px;
      overflow: hidden;
    }

    /* MENU */
    #menu {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .menu-btn {
      padding: 16px;
      border-radius: 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      text-align: center;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
    }

    .menu-btn:hover,
    .menu-btn.active {
      background: rgba(99,102,241,0.2);
      border-color: rgba(99,102,241,0.4);
      transform: translateX(5px);
    }

    /* CONTENT AREA */
    #content {
      background: transparent;
      border-radius: 14px;
      overflow: hidden;
    }

    /* iframe fills completely */
    .content-frame {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>

<body>
  <div id="main">
    <div id="heading">
      <div id="brand">
        <img src="https://raw.githubusercontent.com/faaz13/LOGO/main/LOGO.jpeg" />
        <span>EduLink</span>
      </div>

      <h2>Classroom Dashboard</h2>

      <div id="log_out">
        <a href="#" onclick="logout()">Log Out</a>
      </div>
    </div>

    <div id="dashboard">
      <div id="menu">
        <div class="menu-btn" onclick="loadContent('attendance', this)">
          Attendance
        </div>
        <div class="menu-btn" onclick="loadContent('marks', this)">Marks</div>
        <div class="menu-btn" onclick="loadContent('schedule', this)">
          Schedule Class
        </div>
        <div class="menu-btn" onclick="loadContent('chat', this)">
          Chat With Students
        </div>
      </div>

      <div id="content">
        <h3 style="padding: 20px">Welcome 👋</h3>
      </div>
    </div>
  </div>

  <script>
    // Immediate Auth Check
    (async function checkAuth() {
      try {
        const res = await fetch("https://edulink-backend-o3hw.onrender.com/api/v1/currentUser", {
          method: "POST",
          credentials: "include",
        });
        if (!res.ok) {
          window.location.href = "../login.html";
        }
      } catch (error) {
        window.location.href = "../login.html";
      }
    })();

    // Intercept all fetch calls to handle 401 Unauthorized globally
    const originalFetch = window.fetch;
    window.fetch = async (...args) => {
      const response = await originalFetch(...args);
      if (response.status === 401) {
        window.location.href = "../login.html";
      }
      return response;
    };

    async function logout() {
      try {
        const res = await fetch("https://edulink-backend-o3hw.onrender.com/api/v1/logout/teacher", {
          method: "POST",
          credentials: "include",
        });
        const data = await res.json();
        console.log(data);
      } catch (error) {
        console.log("Logout failed");
      }
      window.location.href = "../login.html";
    }

    const params = new URLSearchParams(window.location.search);
    const classId = params.get("classId"); // e.g., "69aab681c939eaef523d7ffb"

    function loadContent(type, element) {
      document
        .querySelectorAll(".menu-btn")
        .forEach((btn) => btn.classList.remove("active"));

      element.classList.add("active");

      const content = document.getElementById("content");

      if (type === "attendance") {
        content.innerHTML = `<iframe class="content-frame" src="attendence.html?classId=${classId}"></iframe>`;
      } else if (type === "marks") {
        content.innerHTML = `<iframe class="content-frame" src="marks.html?classId=${classId}"></iframe>`;
      } else if (type === "schedule") {
        content.innerHTML = `<iframe class="content-frame" 
        src="classSchedule.html?classId=${classId}"></iframe>`;
      } else {
        content.innerHTML = `<iframe class="content-frame" src="chat.html?classId=${classId}"></iframe>`;
      }
    }
  </script>
</body>

</html>
