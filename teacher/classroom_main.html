<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduLink | Classroom</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --secondary: #94a3b8;
            --white: #ffffff;
            --bg-light: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-color: #f8fafc;
        }

        /* LOCK PAGE HEIGHT (removes outer scrollbar) */
        body {
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a, #020617);
            background-size: 200% 200%;
            animation: gradientShift 15s ease infinite alternate;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-color);
            position: relative;
        }

        @keyframes gradientShift {
            0% { background-position: 100% 0%; }
            100% { background-position: 0% 100%; }
        }

        /* Ambient background blobs */
        .blob {
            position: absolute;
            filter: blur(100px);
            z-index: 0;
            opacity: 0.3;
            border-radius: 50%;
            pointer-events: none;
        }

        .blob-1 { top: -10%; left: -10%; width: 450px; height: 450px; background: #6366f1; }
        .blob-2 { bottom: -10%; right: -10%; width: 550px; height: 550px; background: #3b82f6; }

        /* MAIN CARD */
        #main {
            width: 95%;
            max-width: 1300px;
            height: 94vh;
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            z-index: 10;
            box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            animation: fadeIn 0.5s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* HEADER */
        #heading {
            display: grid;
            grid-template-columns: 260px 1fr auto;
            align-items: center;
            margin-bottom: 30px;
            gap: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        #brand {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }
        
        #brand:hover span {
            color: var(--white);
        }

        #brand img {
            height: 44px;
            border-radius: 12px;
            background: #ffffff;
            padding: 4px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        #brand span {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            transition: 0.3s;
        }

        #heading h2 {
            font-size: 1.4rem;
            color: var(--white);
            font-weight: 600;
        }

        #log_out a {
            text-decoration: none;
            color: #fca5a5;
            font-weight: 600;
            font-size: 14px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 10px 20px;
            border-radius: 12px;
            transition: all 0.3s;
        }
        
        #log_out a:hover {
            background: rgba(239, 68, 68, 0.2);
            color: #fee2e2;
        }

        /* DASHBOARD LAYOUT */
        #dashboard {
            flex: 1;
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 30px;
            overflow: hidden;
        }

        /* MENU */
        #menu {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 15px;
            border-right: 1px solid var(--border-color);
        }

        .menu-btn {
            padding: 16px 20px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid transparent;
            color: var(--secondary);
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--white);
            transform: translateX(4px);
        }

        .menu-btn.active {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(59, 130, 246, 0.2));
            border-color: rgba(99, 102, 241, 0.3);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transform: translateX(4px);
        }

        /* CONTENT AREA */
        #content {
            background: rgba(255, 255, 255, 0.01);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            position: relative;
        }

        /* welcome text */
        .welcome-text {
            padding: 40px;
            font-size: 1.2rem;
            color: var(--secondary);
            font-weight: 500;
        }

        /* iframe fills completely */
        .content-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            animation: fadeIn 0.4s ease-out;
        }
        
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2); 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3); 
        }
    </style>
</head>

<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div id="main">
        <div id="heading">
            <div id="brand" onclick="window.location.href='tr.html'">
                <img src="https://raw.githubusercontent.com/faaz13/LOGO/main/LOGO.jpeg" />
                <span>EduLink</span>
            </div>

            <h2>Classroom Dashboard</h2>

            <div id="log_out">
                <a href="#" onclick="logout()">Log Out</a>
            </div>
        </div>

        <div id="dashboard">
            <div id="menu">
                <div class="menu-btn" onclick="loadContent('attendance', this)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                    Attendance
                </div>
                <div class="menu-btn" onclick="loadContent('marks', this)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                    Marks
                </div>
                <div class="menu-btn" onclick="loadContent('schedule', this)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                    Schedule Class
                </div>
                <div class="menu-btn" onclick="loadContent('chat', this)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    Class Discussion
                </div>
            </div>

            <div id="content">
                <div class="welcome-text">
                    <p style="margin-bottom: 10px; font-size: 1.5rem; color: #fff;">Welcome to the Classroom Manager 👋</p>
                    <p>Select an option from the menu to manage attendance, distribute marks, schedule sessions, or interact with your students.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Immediate Auth Check
        (async function checkAuth() {
            try {
                const res = await fetch("https://edulink-backend-o3hw.onrender.com/api/v1/currentUser", {
                    method: "POST",
                    credentials: "include",
                });
                if (!res.ok) {
                    window.location.href = "../LOGIN.html";
                }
            } catch (error) {
                window.location.href = "../LOGIN.html";
            }
        })();

        // Intercept all fetch calls to handle 401 Unauthorized globally
        const originalFetch = window.fetch;
        window.fetch = async (...args) => {
            const response = await originalFetch(...args);
            if (response.status === 401) {
                window.location.href = "../LOGIN.html";
            }
            return response;
        };

        async function logout() {
            try {
                const res = await fetch("https://edulink-backend-o3hw.onrender.com/api/v1/logout/teacher", {
                    method: "POST",
                    credentials: "include",
                });
                const data = await res.json();
                console.log(data);
            } catch (error) {
                console.log("Logout failed");
            }
            window.location.href = "../LOGIN.html";
        }

        const params = new URLSearchParams(window.location.search);
        const classId = params.get("classId"); // e.g., "69aab681c939eaef523d7ffb"

        function loadContent(type, element) {
            document
                .querySelectorAll(".menu-btn")
                .forEach((btn) => btn.classList.remove("active"));

            element.classList.add("active");

            const content = document.getElementById("content");

            if (type === "attendance") {
                content.innerHTML = `<iframe class="content-frame" src="attendence.html?classId=${classId}"></iframe>`;
            } else if (type === "marks") {
                content.innerHTML = `<iframe class="content-frame" src="marks.html?classId=${classId}"></iframe>`;
            } else if (type === "schedule") {
                content.innerHTML = `<iframe class="content-frame" 
        src="classSchedule.html?classId=${classId}"></iframe>`;
            } else {
                content.innerHTML = `<iframe class="content-frame" src="chat.html?classId=${classId}"></iframe>`;
            }
        }
    </script>
</body>

</html>
