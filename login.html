<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduLink – Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 38px 35px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .logo {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
        }

        .logo-icon {
            width: 52px;
            height: 52px;
            background: #ffffff;
            color: #4f46e5;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 700;
        }

        .logo-text {
            font-size: 28px;
            font-weight: 700;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            opacity: 0.95;
            margin-bottom: 30px;
        }

        .role-switch {
            display: flex;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 30px;
            padding: 6px;
            margin-bottom: 25px;
        }

        .role-btn {
            flex: 1;
            padding: 10px 0;
            border: none;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            background: transparent;
            color: #ffffff;
            transition: all 0.3s ease;
        }

        .role-btn.active {
            background: #ffffff;
            color: #4f46e5;
        }

        form {
            text-align: left;
        }

        label {
            font-size: 13px;
            margin-bottom: 6px;
            display: block;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 12px;
            border: none;
            outline: none;
            font-size: 14px;
            margin-bottom: 18px;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border-radius: 30px;
            border: none;
            background: #ffffff;
            color: #4f46e5;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .login-btn:hover {
            background: #e0e7ff;
            transform: translateY(-2px);
        }

        .extra {
            margin-top: 22px;
            font-size: 13px;
            opacity: 0.95;
        }

        .extra a {
            color: #ffffff;
            font-weight: 600;
            text-decoration: underline;
        }

        .logo-img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            border-radius: 14px;
            background: #ffffff;
            padding: 6px;
        }

        .forgot {
            text-align: right;
            margin-top: -10px;
            margin-bottom: 15px;
        }

        .forgot a {
            font-size: 12px;
            color: #ffffff;
            text-decoration: underline;
            font-weight: 500;
        }

        .forgot a:hover {
            color: #e0e7ff;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="logo">
            <img src="https://raw.githubusercontent.com/faaz13/LOGO/main/LOGO.jpeg
" alt="EduLink Logo" class="logo-img">

        </div>
        <h1>Edulink</h1>
        <div class="subtitle">Log in to continue your learning journey</div>
        <div class="role-switch">
            <button class="role-btn active" id="studentBtn">Student</button>
            <button class="role-btn" id="teacherBtn">Teacher</button>
        </div>
        <!-- Student Login -->
<div id="studentLogin">
    <form id="studentForm">
        <label>Username</label>
        <input type="text" id="studentUsername" placeholder="Enter your username" required />

        <label>Password</label>
        <input type="password" id="studentPassword" placeholder="Enter your password" required minlength="7" />

        <div class="forgot">
            <a href="forgot-password.html">Forgot Password?</a>
        </div>

        <button type="submit" class="login-btn">Login as Student</button>
    </form>
</div>

<!-- Teacher Login -->
<div id="teacherLogin" style="display: none;">
    <form id="teacherForm">
        <label>Teacher ID</label>
        <input type="text" id="teacherUsername" placeholder="Enter your Teacher ID" required />

        <label>Password</label>
        <input type="password" id="teacherPassword" placeholder="Enter your password" required minlength="7" />

        <div class="forgot">
            <a href="forgot-password.html">Forgot Password?</a>
        </div>

        <button type="submit" class="login-btn">Login as Teacher</button>
    </form>
</div>

        <div class="extra">
            Don’t have an account? <a href="SIGNUP.html">Create one</a>
        </div>
    </div>
    <script>
const studentBtn = document.getElementById('studentBtn');
const teacherBtn = document.getElementById('teacherBtn');

const studentDiv = document.getElementById('studentLogin');
const teacherDiv = document.getElementById('teacherLogin');

/* Role Switch */
studentBtn.addEventListener('click', () => {
    studentBtn.classList.add('active');
    teacherBtn.classList.remove('active');

    studentDiv.style.display = "block";
    teacherDiv.style.display = "none";
});

teacherBtn.addEventListener('click', () => {
    teacherBtn.classList.add('active');
    studentBtn.classList.remove('active');

    teacherDiv.style.display = "block";
    studentDiv.style.display = "none";
});

/* Student Login */
document.getElementById("studentForm").addEventListener("submit", function(e){
    e.preventDefault();
    window.open("student.html", "_self");
});

/* Teacher Login */
document.getElementById("teacherForm").addEventListener("submit", function(e){
    e.preventDefault();
    window.open("tr.html", "_self");
});
</script>

</body>


</html>
