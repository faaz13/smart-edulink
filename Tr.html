<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Teacher Page – EduLink</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

/* BODY */
body{
height:100vh;
display:flex;
background:linear-gradient(90deg,#2b6cb0,#0ea5e9);
}

/* SIDEBAR */
.sidebar{
width:260px;
background:linear-gradient(#4f46e5,#3b82f6);
padding:20px;
color:white;
}

.logo{
display:flex;
align-items:center;
gap:10px;
margin-bottom:25px;
}

.logo img{
width:40px;
height:40px;
border-radius:8px;
}

.class-box{
padding:15px;
border-radius:12px;
margin-bottom:12px;
background:rgba(255,255,255,0.15);
display:flex;
justify-content:space-between;
align-items:center;
cursor:pointer;
}

/* MAIN */
.main{
flex:1;
display:flex;
flex-direction:column;
}

/* TOPBAR */
.topbar{
height:70px;
display:flex;
justify-content:flex-end;
align-items:center;
padding:0 25px;
border-bottom:1px solid rgba(255,255,255,0.2);
}

.icon{
font-size:26px;
cursor:pointer;
margin-left:20px;
}

.icon:hover{
transform:scale(1.2);
}

/* CONTENT */
.content{
flex:1;
display:flex;
justify-content:center;
align-items:center;
color:white;
font-size:18px;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

<div class="logo">
<img src="https://raw.githubusercontent.com/faaz13/LOGO/main/LOGO.jpeg">
<h2>EduLink</h2>
</div>

<div id="classList"></div>

</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">
<span class="icon" onclick="openCreate()">➕</span>
<span class="icon">❓</span>
<span class="icon">👤</span>
</div>

<div class="content">
Click ➕ to create a new classroom
</div>

</div>

<script>

/* Open create page */
function openCreate(){
window.location.href="createclass.html";
}

/* Open class */
function openClass(cls){
localStorage.setItem("currentClass",JSON.stringify(cls));
window.location.href="classroomOptions.html";
}

/* Delete class */
function deleteClass(index){

let confirmDelete=confirm("Delete this class?");
if(!confirmDelete) return;

let classes=JSON.parse(localStorage.getItem("classes"))||[];
classes.splice(index,1);

localStorage.setItem("classes",JSON.stringify(classes));
loadClasses();
}

/* Load classes */
function loadClasses(){

let classes=JSON.parse(localStorage.getItem("classes"))||[];

let classList=document.getElementById("classList");
classList.innerHTML="";

classes.forEach((cls,index)=>{

let div=document.createElement("div");
div.className="class-box";

/* Click open */
div.onclick=function(){
openClass(cls);
};

div.innerHTML=`
<span>
<b>${cls.name}</b><br>
<small>${cls.code}</small>
</span>

<span onclick="event.stopPropagation();deleteClass(${index})">
🗑️
</span>
`;

classList.appendChild(div);

});
}

loadClasses();

</script>

</body>
</html>
