<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Create Classroom - EduLink</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
background:linear-gradient(135deg,#7b7dfc,#6bb7f5);
display:flex;
justify-content:center;
align-items:center;
}

.container{
background:rgba(255,255,255,0.15);
backdrop-filter:blur(15px);
padding:40px;
width:420px;
border-radius:20px;
box-shadow:0 15px 40px rgba(0,0,0,0.2);
text-align:center;
color:white;
}

.title{
font-size:24px;
margin-bottom:25px;
}

.input-group{
margin-bottom:15px;
text-align:left;
}

.input-group input,
.input-group select{
width:100%;
padding:10px;
border-radius:10px;
border:none;
outline:none;
font-size:14px;
}

#classCode{
background:#eaeaff;
color:#555;
}

.section-title{
margin:20px 0 10px;
font-size:18px;
font-weight:bold;
}

.btn{
width:100%;
padding:12px;
background:white;
color:#6a6dfc;
font-size:16px;
border:none;
border-radius:30px;
cursor:pointer;
font-weight:bold;
margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<div class="title">Create New Classroom</div>

<form id="classForm">

<div class="input-group">
<label>Class Name</label>
<input type="text" id="className" placeholder="Enter class name">
</div>

<div class="input-group">
<label>Class Code</label>
<input type="text" id="classCode" readonly>
</div>

<div class="section-title">Set Timetable</div>

<!-- Duration -->
<div class="input-group">
<label>From Month & Year</label>
<input type="month" id="fromMonth">
</div>

<div class="input-group">
<label>To Month & Year</label>
<input type="month" id="toMonth">
</div>

<!-- Day 1 -->
<div class="input-group">
<label>Day 1</label>
<select id="day1">
<option value="">Select Day</option>
<option>Monday</option>
<option>Tuesday</option>
<option>Wednesday</option>
<option>Thursday</option>
<option>Friday</option>
<option>Saturday</option>
</select>
<input type="time" id="time1">
</div>

<!-- Day 2 -->
<div class="input-group">
<label>Day 2</label>
<select id="day2">
<option value="">Select Day</option>
<option>Monday</option>
<option>Tuesday</option>
<option>Wednesday</option>
<option>Thursday</option>
<option>Friday</option>
<option>Saturday</option>
</select>
<input type="time" id="time2">
</div>

<!-- Day 3 -->
<div class="input-group">
<label>Day 3</label>
<select id="day3">
<option value="">Select Day</option>
<option>Monday</option>
<option>Tuesday</option>
<option>Wednesday</option>
<option>Thursday</option>
<option>Friday</option>
<option>Saturday</option>
</select>
<input type="time" id="time3">
</div>

<button type="submit" class="btn">Create Class</button>

</form>
</div>

<script>

/* Generate Code */
function generateCode(){
const chars="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
let code="EDU-";
for(let i=0;i<5;i++){
code+=chars.charAt(Math.floor(Math.random()*chars.length));
}
return code;
}

document.getElementById("classCode").value=generateCode();

document.getElementById("classForm").addEventListener("submit",function(e){

e.preventDefault();

let name=document.getElementById("className").value;
let code=document.getElementById("classCode").value;

let fromMonth=document.getElementById("fromMonth").value;
let toMonth=document.getElementById("toMonth").value;

let timetable=[
{day:document.getElementById("day1").value,time:document.getElementById("time1").value},
{day:document.getElementById("day2").value,time:document.getElementById("time2").value},
{day:document.getElementById("day3").value,time:document.getElementById("time3").value}
];

if(name===""){
alert("Enter class name");
return;
}

let classes=JSON.parse(localStorage.getItem("classes"))||[];

classes.push({
name:name,
code:code,
duration:{
from:fromMonth,
to:toMonth
},
timetable:timetable
});

localStorage.setItem("classes",JSON.stringify(classes));

window.location.href="Tr.html";

});

</script>

</body>
</html>
