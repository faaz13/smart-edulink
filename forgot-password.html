<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password – EduLink</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .container {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(12px);
            padding: 35px;
            border-radius: 20px;
            width: 100%;
            max-width: 460px; /* increased width */
            box-shadow: 0 20px 45px rgba(0,0,0,0.3);
            text-align: center;
        }

        h1 {
            margin-bottom: 0;
            font-size: 28px;
            white-space: nowrap;
            flex: 1;
            text-align: left;
        }

        .heading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            margin-bottom: 20px;
            flex-wrap: nowrap;
        }

        .logo {
            width: 110px;
            height: 110px;
            min-width: 110px;
            object-fit: contain;
            border-radius: 18px;
            background: #ffffff;
            padding: 10px;
        }

        .subtitle {
            font-size: 14px;
            margin-bottom: 25px;
            opacity: 0.95;
        }

        label {
            display: block;
            text-align: left;
            font-size: 13px;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: none;
            border-radius: 12px;
            margin-bottom: 15px;
            outline: none;
            font-size: 14px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 30px;
            background: #ffffff;
            color: #4f46e5;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
            transition: 0.3s;
        }

        .btn:hover {
            background: #e0e7ff;
        }

        .otp-box {
            display: none;
            margin-top: 15px;
        }

        .success {
            margin-top: 15px;
            font-size: 14px;
            color: #bbf7d0;
            display: none;
        }

        .back {
            margin-top: 18px;
            font-size: 13px;
        }

        .back a {
            color: #fff;
            text-decoration: underline;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="heading">
        <img src="https://raw.githubusercontent.com/faaz13/LOGO/main/LOGO.jpeg" class="logo">
        <h1>Forgot Password</h1>
    </div>
    <div class="subtitle">Reset using Email or Mobile OTP</div>

    <!-- Email / Mobile Input -->
    <label>Email or Mobile Number</label>
    <input type="text" id="userInput" placeholder="Enter email or mobile" required>

    <button class="btn" onclick="sendOTP()">Send OTP</button>

    <!-- OTP Section -->
    <div class="otp-box" id="otpBox">
        <label>Enter OTP</label>
        <input type="text" id="otpInput" placeholder="Enter OTP">
        <button class="btn" onclick="verifyOTP()">Verify OTP</button>
    </div>

    <div class="success" id="successMsg">
        ✅ OTP Verified! Set your new password below.
    </div>

    <!-- Reset Password Section -->
    <div class="otp-box" id="resetBox" style="display:none;">
        <label>New Password</label>
        <input type="password" id="newPass" placeholder="Enter new password" minlength="7">

        <label>Confirm Password</label>
        <input type="password" id="confirmPass" placeholder="Confirm password" minlength="7">

        <button class="btn" onclick="resetPassword()">Reset Password</button>
    </div>

    <div class="back">
        <a href="login.html">← Back to Login</a>
    </div>
</div>

<script>
    let generatedOTP;

    function sendOTP() {
        const input = document.getElementById('userInput').value;

        if (input === '') {
            alert('Please enter email or mobile number');
            return;
        }

        // Generate 6 digit OTP
        generatedOTP = Math.floor(100000 + Math.random() * 900000);

        alert("Your OTP is: " + generatedOTP + "\n(Note: Demo only — normally sent via SMS/Email)");

        document.getElementById('otpBox').style.display = 'block';
    }

    function verifyOTP() {
        const userOTP = document.getElementById('otpInput').value;

        if (userOTP == generatedOTP) {
            document.getElementById('successMsg').style.display = 'block';
            document.getElementById('resetBox').style.display = 'block';
        } else {
            alert('Invalid OTP ❌');
        }
    }

    function resetPassword() {
        const newPass = document.getElementById('newPass').value;
        const confirmPass = document.getElementById('confirmPass').value;

        if (newPass === '' || confirmPass === '') {
            alert('Please fill all fields');
            return;
        }

        if (newPass.length < 7) {
            alert('Password must be at least 7 characters');
            return;
        }

        if (newPass !== confirmPass) {
            alert('Passwords do not match ❌');
            return;
        }

        alert('✅ Password Reset Successful!');
        window.location.href = 'login.html';
    } else {
            alert('Invalid OTP ❌');
        }
    }
</script>

</body>
</html>
