<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduLink | Classroom</title>

<style>
*{
    box-sizing: border-box;
    font-family: "Segoe UI", sans-serif;
}

body{
    min-height: 100vh;
    background: linear-gradient(135deg, #2563eb, #1e40af);
    display: flex;
    justify-content: center;
    align-items: center;
}

/* MAIN BOX */
#main{
    width: 80%;
    max-width: 900px;
    background: white;
    padding: 35px 40px;
    border-radius: 16px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);
}

/* HEADING */
#heading{
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    margin-bottom: 40px;
}

/* BRAND */
#brand{
    display: flex;
    align-items: center;
    gap: 10px;
}

#brand img{
    height: 42px;
    width: 42px;
}

#brand span{
    font-size: 22px;
    font-weight: 700;
    color: #1e40af;
}

/* CLASS TITLE */
#heading h2{
    text-align: center;
    color: #1e40af;
    font-size: 26px;
}

/* LOGOUT */
#log_out{
    text-align: center;
}

#log_out_photo{
    height: 35px;
    width: 35px;
    border-radius: 50%;
    transition: 0.3s;
}

#log_out a{
    text-decoration: none;
    color: #374151;
    font-size: 14px;
    font-weight: 600;
}

#log_out:hover img{
    transform: scale(1.1);
}

/* OPTIONS GRID */
#option_block{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 25px;
}

.options{
    background: linear-gradient(135deg, #2563eb, #1e40af);
    padding: 24px;
    border-radius: 14px;
    text-align: center;
    transition: 0.3s;
}

.options:hover{
    transform: translateY(-4px);
    box-shadow: 0 12px 25px rgba(0,0,0,0.25);
}

.options a{
    text-decoration: none;
    color: white;
    font-size: 18px;
    font-weight: 600;
    display: block;
}

/* MOBILE */
@media(max-width:768px){
    #option_block{
        grid-template-columns: 1fr;
    }

    #heading{
        grid-template-columns: 1fr;
        gap: 20px;
        text-align: center;
    }

    #brand{
        justify-content: center;
    }
}
</style>
</head>

<body>

<div id="main">

    <!-- HEADING -->
    <div id="heading">

        <div id="brand">
            <img src="https://raw.githubusercontent.com/faaz13/LOGO/main/LOGO.jpeg">
            <span>EduLink</span>
        </div>

        <!-- Class name will come here -->
        <h2 id="classTitle">Classroom Dashboard</h2>

        <div id="log_out">
            <a href="login.html">
                <img id="log_out_photo"
                src="https://raw.githubusercontent.com/faaz13/smart-edulink/main/log_out.jpeg">
                <br>Log Out
            </a>
        </div>

    </div>

    <!-- OPTIONS -->
    <div id="option_block">

        <div class="options">
            <a href="#">Classroom Options</a>
        </div>

        <div class="options">
            <a href="attendence.html">Attendance</a>
        </div>

        <div class="options">
            <a href="marks.html">Marks</a>
        </div>

        <div class="options">
            <a href="schedualClass.html">Schedule Class</a>
        </div>

        <div class="options">
            <a href="chat.html">Chat With Students</a>
        </div>

    </div>

</div>

<script>

/* Get selected class from dashboard */
let currentClass =
JSON.parse(localStorage.getItem("currentClass"));

if(currentClass){

document.getElementById("classTitle").innerText =
currentClass.name + " – Classroom";

}

</script>

</body>
</html>
