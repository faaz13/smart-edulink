<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduLink | Classroom</title>

<style>
*{
    box-sizing: border-box;
    font-family: "Segoe UI", sans-serif;
}

body{
    min-height: 100vh;
    background: linear-gradient(135deg, #2563eb, #1e40af);
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Main Card */
#main{
    width: 90%;
    max-width: 1100px;
    background: white;
    padding: 30px 35px;
    border-radius: 16px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);
}

/* Header */
#heading{
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    margin-bottom: 30px;
}

/* Brand */
#brand{
    display: flex;
    align-items: center;
    gap: 10px;
}

#brand img{
    height: 40px;
    width: 40px;
}

#brand span{
    font-size: 22px;
    font-weight: 700;
    color: #1e40af;
}

/* Title */
#heading h2{
    text-align: center;
    color: #1e40af;
    font-size: 26px;
}

/* Logout */
#log_out{
    text-align: center;
}

#log_out_photo{
    height: 32px;
    width: 32px;
    border-radius: 50%;
}

#log_out a{
    text-decoration: none;
    color: #374151;
    font-size: 14px;
    font-weight: 600;
}

/* Layout */
#dashboard{
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 25px;
}

/* Vertical Menu */
#menu{
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.menu-btn{
    padding: 16px;
    border-radius: 12px;
    background: linear-gradient(135deg, #2563eb, #1e40af);
    color: white;
    font-size: 16px;
    font-weight: 600;
    text-align: center;
    cursor: pointer;
    transition: 0.3s;
}

.menu-btn:hover,
.menu-btn.active{
    transform: translateX(5px);
    box-shadow: 0 8px 18px rgba(0,0,0,0.25);
}

/* Content Area */
#content{
    background: #f9fafb;
    border-radius: 14px;
    padding: 25px;
    min-height: 350px;
}

#content h3{
    color: #1e40af;
    margin-bottom: 15px;
}

/* Mobile */
@media(max-width:900px){
    #dashboard{
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div id="main">

    <div id="heading">
        <div id="brand">
            <img src="https://raw.githubusercontent.com/faaz13/LOGO/main/LOGO.jpeg">
            <span>EduLink</span>
        </div>

        <h2>Classroom Dashboard</h2>

        <div id="log_out">
            <a href="logOut.html">
                <img id="log_out_photo"
                     src="https://raw.githubusercontent.com/faaz13/smart-edulink/main/log_out.jpeg">
                <br>Log Out
            </a>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard">

        <!-- Vertical Menu -->
        <div id="menu">
            <div class="menu-btn" onclick="loadContent('attendance', this)">Attendance</div>
            <div class="menu-btn" onclick="loadContent('marks', this)">Marks</div>
            <div class="menu-btn" onclick="loadContent('schedule', this)">Class Schedule</div>
            <div class="menu-btn" onclick="loadContent('chat', this)">Chat With Students</div>
        </div>

        <!-- Content Area -->
        <div id="content">
            <h3>Welcome 👋</h3>
            <p>Select an option from the left to continue.</p>
        </div>

    </div>

</div>

<script>
function loadContent(type, element){
    document.querySelectorAll('.menu-btn').forEach(btn => btn.classList.remove('active'));
    element.classList.add('active');

    const content = document.getElementById("content");

    if(type === 'attendance'){
        content.innerHTML = `
            <h3>Attendance</h3>
            <p>Here you can mark and view student attendance.</p>
        `;
    }
    else if(type === 'marks'){
        content.innerHTML = `
            <h3>Marks</h3>
            <p>Upload, update and view student marks.</p>
        `;
    }
    else if(type === 'schedule'){
        content.innerHTML = `
            <h3>Schedule Class</h3>
            <p>Create and manage upcoming classes.</p>
        `;
    }
    else if(type === 'chat'){
        content.innerHTML = `
            <h3>Chat With Students</h3>
            <p>Start conversation with your students.</p>
        `;
    }
}
</script>

</body>
</html>
